# ── Research Notes ──────────────────────────────────────────────────

[research]

[research.architecture]
notes = """
Gemma 4 uses standard dense transformer architecture with
rotary positional embeddings. The MLX variants are optimized
for Apple Silicon via the MLX framework, providing significant
throughput gains on M-series chips (70 tok/s at 26B)."""

[research.community]
notes = """
Strong community reputation for instruction following and
classification tasks. Less commonly used for structured output
generation compared to Qwen/Llama families. The context dump
behavior we observed may be related to how Gemma models were
fine-tuned — they appear to treat JSON output instructions as
serialization directives rather than format constraints."""

[research.known_issues]
notes = """
The empty response issue from Ollama /api/chat is not widely
reported in the community — may be specific to the MLX backend
or our prompt structure. Needs further investigation."""

