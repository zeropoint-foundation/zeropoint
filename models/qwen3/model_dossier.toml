# ── Research Notes ──────────────────────────────────────────────────

[research]
# External findings, community reports, architecture notes.

[research.architecture]
notes = """
Qwen3 family uses grouped query attention (GQA), RoPE positional
encoding, SwiGLU activation. The 8B variant is dense (not MoE).
Larger variants (e.g. qwen3.6:35b-a3b) use mixture-of-experts
with active parameter subsets."""

[research.community]
notes = """
Widely reported as strong for structured output and instruction
following in the 8B class. Community consensus aligns with our
bench results — reliable JSON, good classification, adequate
but not exceptional reasoning at 8B scale."""

[research.known_issues]
notes = """
No critical known issues for the 8B variant. The /no_think token
is qwen-specific and not documented in the model card — discovered
empirically by the community. Ollama think option is the portable
equivalent."""
