# ── Research Notes ──────────────────────────────────────────────────

[research]

[research.architecture]
notes = """
Phi-4 uses a standard dense transformer architecture. The key
differentiator is training methodology: curated synthetic data
and reasoning demonstrations from o3-mini, not architectural
innovation. This means the model's reasoning capability comes
from internalized patterns rather than explicit mechanisms
(like MoE routing or thinking tokens)."""

[research.training_provenance]
notes = """
The reasoning variant's training data includes demonstrations from
OpenAI's o3-mini. This is worth noting for the substrate's trust
model: the model has internalized reasoning patterns from a
proprietary system. For governance substrate use, this is neutral
(we're using the model's capabilities, not its training data
directly), but it's a provenance fact worth recording."""

[research.community]
notes = """
Strong reputation for punching above weight class on reasoning
benchmarks. Less community data on long-form conversation, persona
maintenance, or structured output reliability in production
deployments. Most benchmarks test single-turn reasoning, not
the multi-turn cognitive loop the regent needs."""

[research.comparison_to_current]
notes = """
vs qwen3:8b (current regent reasoning):
  - 1.8x parameters
  - Likely 2x tok/s (faster due to efficiency)
  - Stronger on mathematical/logical reasoning
  - Unknown on persona, identity, conversational fluency
  - Different lineage = integration risk but also diversity value

vs qwen3.6:27b (primary candidate):
  - 0.55x parameters (much smaller)
  - Likely 1.8x tok/s (faster)
  - May match or exceed on reasoning despite smaller size
  - Less likely to match on composition and conversation depth
  - Value is as FALLBACK, not replacement — different failure modes"""
