# ── Research Notes ──────────────────────────────────────────────────

[research]

[research.architecture]
notes = """
GLM-5.2 is the third major iteration in the GLM-5 line. 753B total
parameters with 40B active per token (MoE). Key architectural
innovation: IndexShare — reuses the same indexer across every four
sparse attention layers, cutting per-token compute ~2.9x at full
1M context. Multi-token prediction layer for faster decoding.
Released 2026-06-13 under MIT license."""

[research.community]
notes = """
Strong community reception. Positioned as the leading open-weight
coding model, competitive with closed-source frontier models on
long-horizon coding benchmarks. Purpose-built for agentic coding
and tool-driven workloads — directly relevant to ZP's substrate
self-improvement arc (Phase 5). Available via multiple API providers
(Z.ai, Abacus, OpenRouter, NVIDIA NIM) and as downloadable weights
on Hugging Face (zai-org/GLM-5.2)."""

[research.known_issues]
notes = """
No critical known issues reported in community sources as of
2026-07-12. The model is new (4 weeks since release) — community
characterization is still maturing.

Update 2026-07-26: the think_mode question is answered — see
[quirks.thinking_mode]. It resolved into a substrate defect rather than
a model issue: the control parameters exist and the substrate has no way
to send them."""

[research.substrate_gaps]
origin = "researched"
notes = """
Recorded 2026-07-26. Three substrate-side gaps stand between this
dossier and a GLM-5.2 deployment, none of which are properties of the
model:

1. No request-extras passthrough in chat_openai, so thinking cannot be
   disabled and reasoning_content is generated, billed and discarded.
   See [quirks.thinking_mode].

2. No prompts/{model_family}/ resolution. All prompts are compiled-in
   constants, so a model-specific prompt variant cannot be selected.
   The model-prompt coupling invariant assumes this hierarchy exists.

3. Two routing sites use config.inference_endpoint while hardcoding
   InferenceTier::Local — route_from_config and the Evaluation branch
   in routing.rs. With the endpoint pointed at a cloud provider, the
   first mislabels cloud spend as local for mandate accounting and the
   second sends model_evaluate of a local model to the cloud endpoint.
   The main dossier-scored path is correct; cloud_only is derived from
   the presence of an [identity.cloud] table, which this dossier has.

Also unresolved and not substrate-side: cloud_mandate is None, so there
is no token or cost cap in force for a cloud reasoning tier."""

[research.substrate_relevance]
notes = """
Three properties make GLM-5.2 particularly relevant for ZP:
1. MIT license — aligns with substrate sovereignty (no vendor lock-in
   on the model weights themselves, even if accessed via cloud API).
2. 1M context window — enables chain analysis tasks that overflow
   local model context limits (qwen3:8b recommended_context = 8192).
3. Agentic coding focus — directly applicable to Phase 5 self-improvement
   (Regent reading and proposing changes to her own prompts/source)."""
