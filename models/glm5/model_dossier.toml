# ── Quirks ──────────────────────────────────────────────────────────

[quirks]

[quirks.cloud_only]
severity = "informational"
description = """
No local variant exists. 753B MoE cannot run on APOLLO (64GB).
All inference requires network access and API authentication.
Fallback to local Ollama is structurally guaranteed to use a
different model family."""
mitigation = "Fallback mechanism already handles this — cloud failure degrades to local qwen3."

[quirks.moe_latency]
severity = "informational"
description = """
40B active parameters per token is comparable to a dense 40B model
for inference speed, but MoE routing adds overhead. Latency
characteristics not yet measured from the substrate's perspective.
First live test showed acceptable conversational response time
but no precise measurement was taken."""
mitigation = "Measure latency empirically during evaluation battery."

[quirks.thinking_mode]
severity = "blocking"
origin = "researched"          # published API docs, 2026-07-26 — not substrate-measured
description = """
RESOLVED 2026-07-26 (research, not measurement). The open question is
answered and the answer is a blocker, not a caution.

GLM-5.2's OpenAI-compatible surface controls thinking through two
parameters passed via `extra_body`:
  extra_body.thinking      = {"type": "enabled"} | {"type": "disabled"}
  extra_body.reasoning_effort = "high" | "max"   (only when enabled)
Reasoning tokens are returned in a separate `reasoning_content` field
on the message/delta, not in `content`.

The substrate cannot send either parameter. `chat_openai` in
crates/zp-regent/src/inference.rs builds a body containing exactly
model, messages, temperature, stream, and an optional response_format —
there is no extra_body or per-provider passthrough. So GLM-5.2 would
run at its default thinking setting, and the response parser reads only
choices[0].message.content, discarding `reasoning_content` entirely.

Consequence: every compose call generates reasoning tokens that are
billed at the output rate ($4.40/1M), add latency, and are then thrown
away unread. This is a cost and latency defect, not a correctness one —
the prose still arrives — which is why it would not surface as a failed
test."""
mitigation = """
Add a per-provider request-extras passthrough to chat_openai before
deploying GLM-5.2 on the compose tier. Until then the model is usable
but pays for discarded reasoning on every call."""

[quirks.prompt_compatibility_shallow]
severity = "caution"
description = """
Prompt compatibility validated via ONE live conversational test
(2026-07-12). The model correctly handled the unified_system prompt
and produced a coherent, contextual response. However: parameterized
tool dispatch, JSON intent envelope parsing, few-shot routing,
adversarial probes, and context-window stress tests have NOT been run.
Current validation is shallow — sufficient for 'viable' tier
recommendation, not for 'recommended.'"""
mitigation = "Run full evaluation battery before promoting to recommended tier."

# ── Prompt Compatibility ────────────────────────────────────────────

[prompt_compatibility]

[prompt_compatibility.unified_system]
status = "validated_shallow"
notes = """
Single live test (2026-07-12): GLM-5.2 received the full unified_system
prompt with chain context, officer findings, sovereign identity, and
operator input. Produced a coherent response: identified Sentinel
cascade pattern, reported governance_posture via tool call, offered
to investigate. No context dump, no prompt interpretation failure.
Shallow validation — not yet tested with adversarial inputs, edge
cases, or high-context-load scenarios."""

[prompt_compatibility.routing]
status = "untested"
notes = """
Not tested for intent routing (classification). Currently using
claude-sonnet-4-6 for routing tier alongside GLM-5.2 for reasoning.
Testing GLM-5.2 as a router would require the two-tier prompt path."""

[prompt_compatibility.compose]
status = "untested"
notes = """
Not tested with compose-specific prompts, and the target moved:
prompts/compose.md was rewritten 2026-07-26 (task restated at both
prompt boundaries, persona demoted to a VOICE section, new ACTIONS
AVAILABLE THIS CYCLE block, explicit three-state terminal handling).
The rewrite was validated against qwen3:8b only.

This is the tier GLM-5.2 would actually occupy. The two-tier path is
selected when routing_model != reasoning_model, so the intended
configuration -- qwen3:1.7b routing, GLM-5.2 reasoning -- puts GLM on
compose.md and leaves routing local, which is what [tiers.routing]
already recommends.

Note also that there is no prompts/{model_family}/ resolution in the
code. All six prompts are include_str! compiled-in constants; the
override hierarchy described in the model-prompt coupling heuristic is
specified and not built. A GLM-specific compose prompt therefore cannot
be selected today even if one were written."""

[prompt_compatibility.officer_classification]
status = "untested"
notes = "Not tested for officer sweep tasks."

# ── Inference Configuration ─────────────────────────────────────────

[inference]

[inference.openai_compatible]
# Accessed via OpenAI-compatible API (Abacus RouteLLM or Z.ai direct).
# Ollama options do not apply.
#
# `temperature = 0.0` was carried over from the local-model dossiers,
# where it buys deterministic JSON out of small models. Published GLM-5.2
# guidance disagrees: ~1.0 for reasoning work, ~0.3 for tool-calling
# stability. 0.0 is a naive default inherited from a different model
# class, not a characterization of this one.
#
# The substrate currently sends 0.3 on the compose tier
# (crates/zp-regent/src/regent.rs), 0.1 on routing, 0.3 unified — so the
# live compose value already matches published tool-calling guidance and
# the dossier field is the outlier. Left recorded rather than silently
# changed; the evaluation battery is what should set it.
temperature = 0.0                 # origin: inherited — see note above
temperature_researched_reasoning = 1.0    # origin: researched 2026-07-26
temperature_researched_tool_calling = 0.3 # origin: researched 2026-07-26
context_window = 1048576
recommended_context = 32768       # conservative until stress-tested
max_output_tokens = 131072

# Structured output: `response_format = {"type": "json_object"}` (JSON
# mode). Z.ai documents json_object, not json_schema. The substrate's
# chat_openai already emits exactly this shape when a format is
# requested, so the JSON intent envelope path is compatible as written.
# origin: researched 2026-07-26
structured_output_param = "response_format"
structured_output_value = "json_object"
json_schema_supported = false

# Native tool calling follows the standard OpenAI `tools` /
# `tool_choice` schema. Informational only — the substrate does not use
# native tool calling; it parses a JSON intent envelope out of the
# prompt. Recorded so a future migration to native tools knows the
# surface exists. origin: researched 2026-07-26
native_tool_calling = "openai_standard"

[inference.performance]
# Not yet measured from the substrate. These are published figures.
tokens_per_sec = "unknown — cloud-dependent, varies by provider load"
typical_latency_conversation = "acceptable (observed, not measured)"
pricing_input_per_1m = 1.40
pricing_output_per_1m = 4.40

