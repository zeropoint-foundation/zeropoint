[strengths]

instruction_following = """
Strong. Live substrate test (2026-07-12) showed GLM-5.2 correctly
interpreting the unified_system.md prompt: read chain state,
interpreted Sentinel findings, identified cycling cadence in
officer emissions, offered to investigate. No context dumps,
no prompt interpretation failure. Instruction following benchmarks
(IFEval) reported as strong in published evaluations."""

structured_output = """
Supports structured outputs and JSON schema validation natively.
Published as a key capability. Not yet tested against the substrate's
