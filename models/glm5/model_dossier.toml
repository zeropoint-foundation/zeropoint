within the unified prompt's JSON contract, which succeeded."""

coding = """
Strongest open-weight coding model as of June 2026. Competitive
with Claude Opus 4.8 on long-horizon coding benchmarks. Purpose-built
for agentic coding and tool-driven workloads. Relevant to future
substrate self-improvement (Phase 5 — Regent reads own source)."""

context_window = """
1,048,576 tokens (1M). Largest context window in the dossier corpus.
Output up to 131,072 tokens. IndexShare architecture reuses indexer
