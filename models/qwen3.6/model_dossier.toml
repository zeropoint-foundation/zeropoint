# ── Identity ────────────────────────────────────────────────────────

[identity]
family = "qwen3.6"
provider = "Alibaba Cloud / Qwen Team"
variants_available = ["qwen3.6:27b", "qwen3.6:27b-mlx", "qwen3.6:35b-a3b", "qwen3.6:27b-q4_K_M", "qwen3.6:27b-q8_0"]
variant_primary = "qwen3.6:27b-mlx"
architecture = "decoder-only transformer, dense (27b) and MoE (35b-a3b)"
license = "Apache 2.0"
context_window = 262_144              # 256K native, extensible to 1M+
release_date = "2026"

[identity.parameters]
"qwen3.6:27b" = "27B dense"
"qwen3.6:27b-mlx" = "27B dense, MLX-optimized for Apple Silicon"
"qwen3.6:35b-a3b" = "35B MoE, ~3B active parameters per token"

# ── Strengths (Researched) ──────────────────────────────────────────

[strengths]

reasoning = """
Flagship of the Qwen3.6 family. 77.2% SWE-bench — highest among
models runnable on consumer hardware. Handles repository-level
reasoning and multi-file understanding. Significant upgrade over
qwen3:8b for complex cognitive tasks."""

tool_calling = """
Native tool calling support. Produces valid tool-call JSON when
think: false is passed. All quantized variants reportedly maintain
tool-call JSON validity. This is critical for regent Phase 1
(IntentExecutor + gate dispatch)."""

instruction_following = """
Described as prioritizing 'stability and real-world utility' over
the 3.5 series. More intuitive and responsive. Same family as
qwen3:8b so prompt patterns should transfer, but with substantially
more reasoning depth at 27B."""

context_handling = """
262K native context window, extensible to 1M+. Far exceeds the
regent's current 8K recommended context. Opens the possibility
of feeding significantly more chain history and officer findings
per cognitive cycle."""

family_continuity = """
Same model family as the current production roster (qwen3:8b for
reasoning, qwen3:1.7b for routing, qwen3.6:35b-a3b for officer
escalation). Prompt compatibility is expected to be high, reducing
integration risk. The model-prompt coupling invariant favors
in-family upgrades."""

# ── Quirks (Researched) ────────────────────────────────────────────

[quirks]

[quirks.thinks_by_default]
severity = "informational"
description = """
Qwen3.6 thinks by default — chain-of-thought reasoning is emitted
unless explicitly suppressed. For the regent's structured intent
envelope, thinking must be disabled via think: false in Ollama
options. The model respects this cleanly per community reports."""
mitigation = "Set think: false in Ollama inference options for structured output tasks."

[quirks.ollama_thinking_hook_bypass]
severity = "caution"
description = """
Ollama 0.24 reportedly ignores the disable-thinking hook for Qwen3
family and keeps streaming reasoning chunks. These decode at full
model rate. If this affects Qwen3.6, thinking suppression via
Ollama options may not work as expected. Needs empirical validation."""
mitigation = "Test think: false behavior empirically during bench. If Ollama ignores it, test /no_think token in user message as fallback."

[quirks.mlx_performance_plateau]
severity = "informational"
description = """
Community benchmarks show MLX advantage collapses at 27B+ where
memory bandwidth saturates. The 20-87% MLX speedup seen at <14B
may not apply. Expect performance closer to standard GGUF inference.
Still, the MLX variant should match or slightly exceed non-MLX."""
mitigation = "Bench both qwen3.6:27b-mlx and qwen3.6:27b to determine if MLX variant is worth the specificity."

[quirks.coding_focus]
severity = "informational"
description = """
Qwen3.6 is described as 'flagship coding in a 27B dense package.'
The training emphasis on coding may or may not translate to the
regent's needs (governance reasoning, operator communication,
chain interpretation). Coding skill correlates with structured
output quality but not necessarily with persona maintenance or
conversational nuance."""
mitigation = "Test conversational and identity-related prompts specifically, not just JSON compliance."

# ── Prompt Compatibility (Pre-Test Hypotheses) ──────────────────────

[prompt_compatibility]

[prompt_compatibility.unified_system]
status = "untested"
hypothesis = """
HIGH probability of compatibility. Same family as qwen3:8b which
validates cleanly. 27B should handle the JSON envelope constraint
at least as well as 8B. The sovereign_line injection should work
identically. Key test: does the model connect 'You serve operator
kenrom' with 'who am I?' — the question qwen3:8b fails."""

[prompt_compatibility.routing]
status = "untested"
hypothesis = """
Likely overkill for routing. 27B is much larger than needed for
intent classification. May be worth testing but qwen3:1.7b is
already fast and accurate for routing. No reason to change."""

[prompt_compatibility.compose]
status = "untested"
hypothesis = """
This is where 27B should shine over 8B. Longer, more coherent
composed responses. Better persona maintenance. More nuanced
operator communication. The primary target for bench testing."""

[prompt_compatibility.officer_classification]
status = "partially_validated"
hypothesis = """
The 35b-a3b MoE variant is already deployed for officer escalation
(trajectory boundary, 1.00 accuracy). The 27b dense variant should
perform at least as well on classification tasks, but gemma4 is
faster and already deployed for fast-path — no reason to replace."""

# ── Inference Configuration (Pre-Test) ──────────────────────────────

[inference]

[inference.ollama]
think = false                    # suppress for structured output
format_json = true               # use native format parameter
temperature = 0.0                # deterministic for intent classification
context_window = 262_144         # model maximum
recommended_context = 16_384     # start conservative, expand with testing

[inference.performance]
# ESTIMATED — not yet measured on APOLLO.
# Community reports ~55 tok/s for the 35b-a3b MoE on Apple Silicon.
# The 27b dense should be comparable or slightly faster.
estimated_tokens_per_sec = 50    # conservative estimate for 27b-mlx
estimated_latency_classify = 0.5 # seconds, with format parameter
estimated_latency_compose = 3.0  # seconds, longer composition

