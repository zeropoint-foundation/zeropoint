# ── Research Notes ──────────────────────────────────────────────────

[research]

[research.architecture]
notes = """
Qwen3.6 is positioned as the first open-weight variant after the
Qwen3.5 series. The 27B dense variant uses the same GQA + RoPE +
SwiGLU architecture as earlier Qwen models but with significant
training improvements focused on coding and agentic workflows.
The MoE variant (35b-a3b) uses sigmoid gating. Both support
sliding-window attention patterns."""

[research.community]
notes = """
Community describes Qwen3.6 as the best overall model on consumer
hardware (77.2% SWE-bench, Apache 2.0, fits in 24GB at Q4).
Strong endorsements for agentic coding. Less community data on
general conversation quality, persona maintenance, or governance
reasoning — these are substrate-specific needs that require our
own bench."""

[research.integration_risk]
notes = """
LOWEST RISK candidate. Same family means:
- /no_think token works (if needed)
- JSON output patterns match qwen3:8b
- Ollama options (think, format) behave identically
- System prompt structure carries over
- Prompt resolution hierarchy (prompts/qwen3.6/ → prompts/base/)
  may not even need model-specific prompts if base works

The primary unknown is whether 27B resolves the sovereign identity
gap that 8B exhibits, or whether that's a prompt issue independent
of model scale."""

[research.comparison_to_current]
notes = """
vs qwen3:8b (current regent reasoning):
  - 3.4x parameters
  - 262K vs 32K context window
  - Expected: deeper reasoning, better persona, richer composition
  - Expected: slower (50 vs 45 tok/s estimate)
  - Risk: minimal — same family, same prompt patterns

vs gemma4:26b-mlx (officer fast-path):
  - Similar parameter count (27B vs 26B)
  - Qwen family has proven JSON compliance for regent use
  - gemma4 has the context-dump failure mode that blocks it from regent
  - If qwen3.6:27b works for regent, no reason to try gemma4 again"""
