# ── Entropy baseline (H3 in zp-emission-coherence) ──────────────────
#
# H3 (token entropy anomaly) in zp-emission-coherence compares observed
# per-token surprise = mean(-log P(chosen)) against this baseline.
# Populated by running a calibration battery of representative prompts
# against this model and computing the sample mean and standard
# deviation of per-token surprise across the responses.
#
# State stays "not_yet_calibrated" until real calibration data lands.
# When state="calibrated", the loader in zp-regent/loop_runner.rs
# inserts this baseline into AnalyzerConfig.entropy_baselines keyed
# by target_variant. H3 then fires with severity Warning if observed
# mean drops 2σ below mean, Critical if 3σ+ below. See
# REGENT-DOOM-LOOP-DETECTION-2026-07.md §Heuristic 3.
#
# Baselines are variant-specific: identical prompts to a 1.7B and an
# 8B of the same family produce measurably different surprise
# distributions. First-shipping schema targets the primary_variant;
# multi-variant families can migrate to [[entropy_baseline]] array
# once calibration expands.

[entropy_baseline]
state = "not_yet_calibrated"
target_variant = "llama4:scout"
mean = 0.0                    # mean(-log P(chosen)) over the battery
std_dev = 0.0                 # sample std dev
battery_prompt_count = 0      # number of prompts in the calibration set
battery_receipt = ""          # chain receipt for the calibration run
calibrated_at = ""            # ISO-8601 timestamp when calibration ran
