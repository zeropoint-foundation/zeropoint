# ── Research Notes ──────────────────────────────────────────────────

[research]

[research.architecture]
notes = """
Llama 4 introduces early fusion multimodal (text + images processed
together, not adapter-mediated) and native tool calling at the
architecture level. The MoE design with fixed 17B active parameters
gives scaling benefits without proportional inference cost.

The 10M context window on Scout is achieved through 'rope-theta-based
long-context extension' — no explicit sliding window. This is
architecturally different from Qwen3.6's sliding window attention."""

[research.tool_calling_architecture]
notes = """
This is the most interesting architectural feature for the substrate.
Current regent inference:
  System prompt → 'reply with JSON' → hope model complies → parse

With native tool calling:
  Present intents as tools → model selects tool + fills parameters
  → output is structurally valid by construction

The second approach is what Ollama's 'format' parameter does at the
grammar level, but tool calling adds semantic structure: the model
doesn't just produce valid JSON, it produces a valid *call* to a
named *function* with typed *parameters*. This maps directly to
the regent's Intent enum (Respond, Execute, Observe, Confused).

Worth exploring even if qwen3.6:27b becomes the production model —
the tool-calling approach could work across model families and
eliminate the model-specific prompt engineering surface entirely."""

[research.community]
notes = """
Meta positions Llama 4 for agentic workflows, not conversation.
Community adoption is massive (llama3.1 has 116.5M pulls on Ollama),
but most usage is on NVIDIA hardware. Apple Silicon MoE performance
data is still emerging. Early reports suggest Scout runs well on
M-series chips but concrete tok/s benchmarks are scarce."""

[research.comparison_to_current]
notes = """
vs qwen3:8b (current regent reasoning):
  - 17B active vs 8B (2x effective parameters)
  - Native tool calling vs prompt-instructed JSON
  - 10M vs 32K context window
  - Different family = higher integration risk
  - Potentially eliminates structured output prompt engineering

vs qwen3.6:27b (primary candidate):
  - 17B active vs 27B dense (less raw compute per token)
  - Native tool calling is architectural advantage
  - MoE overhead vs dense throughput — empirical question
  - Higher integration risk (different family, different prompt format)
  - Value is in the approach (tool calling), not the benchmarks

vs phi4-reasoning:
  - 17B active vs 14.7B dense (similar effective size)
  - Tool calling architecture vs reasoning training
  - Different strengths: Scout = structured output reliability,
    Phi4 = reasoning depth per parameter
  - Both are diversity candidates against the Qwen primary"""

