[package]
name = "zp-mesh"
description = "Sovereign mesh transport for ZeroPoint agents — Reticulum-compatible cryptographic networking"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Local workspace crates
zp-core = { path = "../zp-core" }
zp-trust = { path = "../zp-trust" }
zp-receipt = { path = "../zp-receipt" }
zp-audit = { path = "../zp-audit" }

# Workspace dependencies
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
thiserror.workspace = true
anyhow.workspace = true
chrono.workspace = true
uuid.workspace = true
hex.workspace = true
rand.workspace = true
blake3.workspace = true

# Cryptography — Ed25519 signing + X25519 key exchange (Reticulum-compatible)
ed25519-dalek.workspace = true
x25519-dalek.workspace = true
sha2.workspace = true
hkdf.workspace = true
aes.workspace = true
cbc.workspace = true
hmac.workspace = true

# libp2p PeerId derivation (Architecture II.6 / II.10) — same Ed25519 key
# produces both a Reticulum destination hash and a libp2p PeerId.
libp2p-identity.workspace = true

# libp2p stack for the Libp2pInterface adapter (Architecture II.10).
# MVP: TCP transport + gossipsub for broadcast. QUIC / WebSocket / WebRTC
# follow in future commits.
libp2p.workspace = true

# Serialization — msgpack for Reticulum wire format
rmp-serde.workspace = true

# Database — persistent mesh state
rusqlite.workspace = true

[dev-dependencies]
tokio-test.workspace = true
tempfile = "3"

[features]
default = []
# Enable inbound mesh payload authentication (RFC: docs/rfc-mesh-inbound-auth-v1.md).
# When off, MeshBridge accepts unsigned inbound receipts as-is (legacy v0 behavior).
# When on, CompactReceipt signatures are verified against a PeerKeyStore where keys are known.
mesh-auth-v1 = []
# Test-support helpers exposed to external test crates. Production
# builds MUST NOT enable this feature — it unlocks `record_unverified`
# on `NodeRegistry`, which bypasses the Seam 3 signature check. Inside
# `zp-mesh` the helpers are available unconditionally to `cfg(test)`
# so the crate's own test suite needs no opt-in.
test-support = []
