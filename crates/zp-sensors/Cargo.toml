[package]
name = "zp-sensors"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Event-driven sensor layer for ZeroPoint governance — kqueue process/file watches and port discovery"

[dependencies]
# Async
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Time
chrono = { workspace = true }

# Logging
tracing = { workspace = true }

# Error handling
thiserror = { workspace = true }

# Port discovery — maps processes to listening network ports via system APIs.
# ~1ms per call on macOS. Cross-platform (macOS, Linux, FreeBSD).
listeners = "0.6"

# Low-level libc bindings for kqueue syscalls.
[target.'cfg(any(target_os = "macos", target_os = "freebsd"))'.dependencies]
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tempfile = "3"
