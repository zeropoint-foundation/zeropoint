[package]
name = "zp-gossip"
version = "0.1.0"
edition = "2021"
description = "Gossip network for Regent collective intelligence — typed findings, allowance economics, intake limiting"

[dependencies]
zp-core = { path = "../zp-core" }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"
thiserror = "1"
tracing = "0.1"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
