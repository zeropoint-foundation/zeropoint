[package]
name = "zp-anchor-ots"
version = "0.1.0"
edition = "2021"
description = "OpenTimestamps backend for the ZeroPoint TruthAnchor trait — the anchor floor"
license = "Apache-2.0"

[dependencies]
zp-anchor = { path = "../zp-anchor" }

async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.35", features = ["fs", "macros", "rt", "time"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.35", features = ["full"] }
