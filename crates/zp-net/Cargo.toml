[package]
name = "zp-net"
version = "0.1.0"
edition = "2021"

# Canonical loopback networking primitives.
#
# Bottom-of-graph: depends on no other zp-* crate. All substrate
# loopback servers route their TcpListener bind through `bind_loopback`
# (HTTP) or `serve_loopback_grpc_with_shutdown` (tonic). All substrate
# clients addressing a substrate peer service route URL construction
# through `peer_url` / `peer_url_with_path` / `peer_origin` /
# `peer_grpc_uri`.
#
# Discipline pins in `zp-discipline` enforce that direct
# `TcpListener::bind`, `tonic::transport::Server::builder().serve(...)`,
# and raw `http://localhost:` / `http://127.0.0.1:` URL literals do
# not appear outside this crate's `src/`.

[dependencies]
tokio = { workspace = true }
tokio-util = "0.7"
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { workspace = true }
http = "1"
anyhow = { workspace = true }
tracing = { workspace = true }
