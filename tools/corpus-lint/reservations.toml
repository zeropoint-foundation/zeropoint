# ── AGNTCY spec quotation false-positive on tie-off regex ──

[[reservation]]
kind = "prose"
check = "tie-off"
subject = "MCP-COMPOSITION-2026-08.md"
disposition = "limited"
declared = "2026-09-05"
rationale = """
Not a substrate tie-off. Line 1197 quotes the AGNTCY Identity spec verbatim: \
its three identity requirement properties (Open, Collision-free, Verifiable), \
where "Open" is a term of art for "no centralized authority is required for \
assigning identities" — a *property name* in bold, not a Stage-1t disposition \
marker. The tie-off regex `\\*(declined|deferred|open|limited)\\.?\\*` matches \
`**Open**` inside the quoted spec text as if it were a substrate disposition. \
Rewriting the quotation to avoid the regex would distort the AGNTCY spec's own \
formatting; adding a reservation preserves the verbatim quote while marking \
the finding as a linter false-positive.
"""

