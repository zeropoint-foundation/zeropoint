<style>

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {

  display: flex; flex-direction: column;
}
header {

}
.brand { font-weight: 700; font-size: 14px; letter-spacing: -0.01em; }
.brand .dim { color: var(--muted); font-weight: 400; margin-left: 8px; }
.tabs { display: flex; gap: 4px; }
.tab {

  border: 1px solid transparent;
  padding: 6px 14px; border-radius: 6px;
  font: inherit; font-size: 12px; font-weight: 500;
  cursor: pointer; letter-spacing: 0.02em;
  transition: color 120ms, background 120ms, border-color 120ms;
}
.tab:hover { color: var(--text); background: var(--bg2); }
.tab.active { color: var(--accent-bright); background: var(--bg2); border-color: var(--accent-dim); }
.tab .q { color: var(--dim); font-weight: 400; margin-left: 6px; font-size: 11px; }
.tab.active .q { color: var(--muted); }
.filter-group { display: flex; align-items: center; gap: 4px; margin-left: 8px; }
.filter-label {
  font-family: var(--mono); font-size: 10px; color: var(--dim);
  text-transform: uppercase; letter-spacing: 0.08em; margin-right: 4px;
}
.filter-chip {
  background: transparent; color: var(--dim);
  border: 1px solid var(--border);
  padding: 3px 9px; border-radius: 999px;
  font: inherit; font-size: 10px; font-family: var(--mono);
  cursor: pointer; letter-spacing: 0.02em;
  transition: color 120ms, background 120ms, border-color 120ms;
}
.filter-chip:hover { color: var(--muted); }
.filter-chip.active { color: var(--text); border-color: var(--accent-dim); }
.spacer { flex: 1; }
.stats { color: var(--muted); font-size: 11px; font-family: var(--mono); }
.stats strong { color: var(--text); font-weight: 500; }

main {
  flex: 1; display: flex; overflow: hidden;
  position: relative;
}
.viewport {
  flex: 1; position: relative;
  overflow: hidden; background: var(--bg);
}
.viewport svg { display: block; width: 100%; height: 100%; }
.viewport-hint {
  position: absolute; top: 16px; left: 16px;
  color: var(--muted); font-size: 11px; font-family: var(--mono);
  pointer-events: none; z-index: 2;
  max-width: 340px;
}
.viewport-hint em { color: var(--text); font-style: normal; }

aside.sidebar {

.sb-empty { color: var(--dim); font-size: 12px; font-style: italic; }
.sb-title { font-weight: 600; font-size: 14px; letter-spacing: -0.01em; color: var(--text); }
.sb-meta {

  font-family: var(--mono); font-size: 11px;
}
.sb-chip {

  padding: 2px 8px; border-radius: 999px;
  border: 1px solid var(--border);
}
.sb-chip.tier-1 { color: var(--accent-bright); border-color: var(--accent-dim); }
.sb-chip.tier-2 { color: var(--teal); border-color: rgba(148,226,213,0.3); }

.sb-chip-scaffolded { color: var(--accent); border-color: rgba(126,184,218,0.3); }

.tp-label {

  min-width: 80px;
}
.tp-label strong { color: var(--text); font-weight: 500; }

.node circle, .node rect {

}
.node:hover circle, .node:hover rect { stroke-width: 2 !important; }
.node.selected circle, .node.selected rect {

  stroke-width: 2.5 !important;

.node.faded { opacity: 0.15; }
.node.walked circle, .node.walked rect {
  filter: drop-shadow(0 0 4px currentColor);

.edge {

}

.edge.faded { opacity: 0.04; }
.axis-line { stroke: var(--border); stroke-width: 1; }
.axis-label {

.axis-label.y { text-anchor: end; }
.epoch-line { stroke: var(--border); stroke-width: 1; stroke-dasharray: 3 3; }
.epoch-label {
  fill: var(--dim); font-family: var(--mono); font-size: 9px;
  text-transform: uppercase; letter-spacing: 0.08em;

.node-label {
  fill: var(--text); font-family: var(--font); font-size: 10px;
  pointer-events: none;
  text-anchor: middle;
}
.node-label.small { font-size: 9px; fill: var(--muted); }
.wire-label {
  fill: var(--muted); font-family: var(--mono); font-size: 10px;
  text-anchor: start;

.legend {

  background: rgba(17,17,22,0.94);

  font-size: 11px;
  z-index: 3;

"with_edges":162,"total_edges":627,"by_build_state":{"unknown":47,"built":118,"scaffolded":34,"partial":71,"candidate":38,"keel":1}},"root":"KEEL-2026-07.md","existing_code":["audio","clawd","cli","core","course-examples","dashboard","ember","execution-engine","foundation","frameworks","gate-ping","internal","ironclaw","listeners-test","local-model-bench","merlin-sentinel","mindmap-mcp","mle-star-engine","monte-carlo-engine","sentinel","server","services","sidecar","trust-triangle","webui-next","youtube-transcript-mcp","zeropoint-py","zeropoint-server","zeropoint.global","zeropointfoundation.org","zp-anchor","zp-artifacts","zp-audit","zp-bench","zp-cli","zp-cloudflare","zp-config","zp-configure","zp-content","zp-core","zp-discipline","zp-engine","zp-gate-envelope","zp-gossip","zp-hardening-tests","zp-host","zp-introduction","zp-keys","zp-learning","zp-llm","zp-memory","zp-memory-index","zp-mesh","zp-net","zp-observation","zp-officers","zp-pipeline","zp-policy","zp-preflight","zp-receipt","zp-regent","zp-sensors","zp-server","zp-skills","zp-trust","zp-verbs","zp-verify"]}
</script>

<script>
(function(){
  // -------- Manifest --------
  const M = JSON.parse(document.getElementById('manifest').textContent);
  // Doc lookup by filename
  const byName = {};
  M.docs.forEach(d => { byName[d.f] = d; });

  // Effective time per doc — prefer declared_date (more meaningful) over mtime (staging noise).
  function effT(d) {
    if (d.dd) {
      const parts = d.dd.split('-');
      return Date.UTC(+parts[0], +parts[1]-1, +(parts[2]||1)) / 1000;
    }
    return d.mt;
  }
  M.docs.forEach(d => { d._t = effT(d); });
  const times = M.docs.map(d => d._t).filter(Boolean);
  const tMin = Math.min(...times);
  const tMax = Math.max(...times);
  // URL param lens
  const urlLens = new URLSearchParams(location.search).get('lens');

  // -------- State --------
  let activeLens = 'abacus';
  let selected = null;
  let walkT = tMax; // current transport head
  let playing = false;
  let playTimer = null;
  // Build-state filter: which states are visible
  let visibleStates = new Set(['built','partial','scaffolded','candidate','keel']);

  // Build-state visual spec
  const BS_LABELS = {
    keel: 'KEEL',
    built: 'built',
    partial: 'partial',
    scaffolded: 'scaffolded',
    candidate: 'candidate',
    unknown: 'unknown',
  };
  // Renders a bead per build state
  function beadAttrs(bs, color, r, walkedIn) {
    // Base: filled solid = built, ring = scaffolded, dashed = candidate, hollow = partial, tiny = unknown
    const inactive = !walkedIn;
    if (bs === 'keel') return { fill: inactive ? '#18181f' : color, stroke: color, 'stroke-width': 2, r: r * 1.4 };
    if (bs === 'built') return { fill: inactive ? '#18181f' : color, stroke: color, 'stroke-width': 1, r };
    if (bs === 'partial') return { fill: inactive ? '#18181f' : color, 'fill-opacity': inactive ? 1 : 0.5, stroke: color, 'stroke-width': 1.5, r };
    if (bs === 'scaffolded') return { fill: '#18181f', stroke: color, 'stroke-width': 1.5, r };
    if (bs === 'candidate') return { fill: 'transparent', stroke: color, 'stroke-width': 1, 'stroke-dasharray': '2 2', r };
    // unknown: tiny dim
    return { fill: '#18181f', stroke: '#55556a', 'stroke-width': 0.5, r: Math.max(2, r * 0.6) };
  }
  function bsVisible(d) { return visibleStates.has(d.bs); }

  // -------- Palette --------
  const P = {
    bg: '#0a0a0c', bg1: '#111116', bg2: '#18181f', surface: '#1a1a1f',
    border: '#222228', text: '#e8e8ec', muted: '#8888a0', dim: '#55556a',
    accent: '#7eb8da', accentDim: '#4a7a96', accentBright: '#a8d4ee',
    teal: '#94e2d5', coral: '#f87171', lavender: '#a78bfa',
    saffron: '#fbbf24', sage: '#34d399', rose: '#fb923c',
  };

  const subdirColor = {
    '': P.accent,          // top-level (KEEL, ARCHITECTURE, etc.)
    'design': P.teal,      // Tier-2 elaborations
    'handoffs': P.lavender // Tier-3 historical
  };
  const tierColor = {
    1: P.accent, 2: P.teal, 3: P.muted
  };

  // -------- DOM --------
  const svg = document.getElementById('canvas');
  const hint = document.getElementById('hint');
  const legend = document.getElementById('legend');
  const stats = document.getElementById('stats');
  const sbEmpty = document.getElementById('sb-empty');
  const sbContent = document.getElementById('sb-content');
  const scrub = document.getElementById('scrub');
  const scrubLabel = document.getElementById('scrub-label');
  const playBtn = document.getElementById('play');
  const resetBtn = document.getElementById('reset');

  // -------- Utils --------
  function fmtDate(ts) {
    const d = new Date(ts * 1000);
    return d.toISOString().slice(0, 10);
  }
  function fmtMonth(ts) {
    const d = new Date(ts * 1000);
    return d.toISOString().slice(0, 7);
  }
  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }
  function svgEl(tag, attrs) {
    const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
    if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function getVBSize() {
    const r = svg.getBoundingClientRect();
    return { w: r.width, h: r.height };
  }

  // -------- Tab switching --------
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      activeLens = t.dataset.lens;
      render();
    });
  });

  // -------- Filter chips --------
  document.querySelectorAll('.filter-chip').forEach(c => {
    c.addEventListener('click', () => {
      const bs = c.dataset.bs;
      if (visibleStates.has(bs)) { visibleStates.delete(bs); c.classList.remove('active'); }
      else { visibleStates.add(bs); c.classList.add('active'); }
      render();
    });
  });

  // -------- Stats bar (dynamic) --------
  function updateStats() {
    const bs = M.counts.by_build_state || {};
    stats.innerHTML = `<strong>${M.counts.total}</strong> docs · <strong>${bs.built||0}</strong> built · <strong>${bs.partial||0}</strong> partial · <strong>${bs.scaffolded||0}</strong> scaffolded · <strong>${bs.candidate||0}</strong> candidate`;
  }
  updateStats();

  // -------- Transport --------
  scrub.addEventListener('input', () => {
    const p = parseFloat(scrub.value) / 100;
    walkT = tMin + (tMax - tMin) * p;
    updateScrubLabel();
    if (p >= 0.999) {
      scrubLabel.innerHTML = '<strong>all</strong>';
    }
    render();
  });
  playBtn.addEventListener('click', () => {
    if (playing) { stopPlay(); return; }
    if (parseFloat(scrub.value) >= 100) scrub.value = 0;
    startPlay();
  });
  resetBtn.addEventListener('click', () => {
    stopPlay();
    scrub.value = 100;
    walkT = tMax;
    updateScrubLabel();
    render();
  });
  function updateScrubLabel() {
    const p = parseFloat(scrub.value) / 100;
    if (p >= 0.999) {
      scrubLabel.innerHTML = '<strong>all</strong>';
    } else {
      scrubLabel.innerHTML = `<strong>${fmtDate(walkT)}</strong>`;
    }
  }
  function startPlay() {
    playing = true;
    playBtn.textContent = 'Pause';
    let last = performance.now();
    function step(now) {
      if (!playing) return;
      const dt = now - last; last = now;
      const cur = parseFloat(scrub.value);
      const next = Math.min(100, cur + dt * 0.04); // ~2.5s to traverse
      scrub.value = next;
      const p = next / 100;
      walkT = tMin + (tMax - tMin) * p;
      updateScrubLabel();
      render();
      if (next >= 100) { stopPlay(); return; }
      playTimer = requestAnimationFrame(step);
    }
    playTimer = requestAnimationFrame(step);
  }
  function stopPlay() {
    playing = false; playBtn.textContent = 'Play';
    if (playTimer) cancelAnimationFrame(playTimer);
    playTimer = null;
  }

  // -------- Node selection + sidebar --------
  function selectDoc(f) {
    selected = f;
    render();
    renderSidebar(byName[f]);
  }
  function renderSidebar(d) {
    if (!d) {
      sbEmpty.style.display = 'block';
      sbContent.style.display = 'none';
      return;
    }
    sbEmpty.style.display = 'none';
    sbContent.style.display = 'flex';
    const subdirLabel = d.sd ? `docs/${d.sd}/` : 'docs/';
    const tierLabel = d.tr ? `T${d.tr}` : '';
    const dateLabel = d.dd || fmtDate(d.mt);
    const parts = [];
    parts.push(`<div class="sb-title">${esc(d.t)}</div>`);
    const bsClass = d.bs === 'built' ? 'sb-chip-built'
                  : d.bs === 'partial' ? 'sb-chip-partial'
                  : d.bs === 'scaffolded' ? 'sb-chip-scaffolded'
                  : d.bs === 'candidate' ? 'sb-chip-candidate'
                  : 'sb-chip-unknown';
    parts.push(`<div class="sb-meta">
      <span class="sb-chip">${esc(subdirLabel)}${esc(d.f)}</span>
      <span class="sb-chip tier-${d.tr}">${esc(tierLabel)}</span>
      <span class="sb-chip ${bsClass}">${esc(d.bs)}</span>
      <span class="sb-chip">${esc(dateLabel)}</span>
      <span class="sb-chip">${d.wc.toLocaleString()} words</span>
      ${d.au ? `<span class="sb-chip">${esc(d.au)}</span>` : ''}
    </div>`);
    if (d.cm && d.cm.length) {
      parts.push(`<div class="sb-section">
        <div class="sb-section-label">Code refs found in tree (${d.cm.length})</div>
        <div class="sb-list">${d.cm.map(c => `<span class="sb-chip sb-chip-built" style="font-family:var(--mono);text-align:left;">${esc(c)}</span>`).join('')}</div>
      </div>`);
    }
    if (d.cx && d.cx.length) {
      parts.push(`<div class="sb-section">
        <div class="sb-section-label">Referenced but not found (${d.cx.length})</div>
        <div class="sb-list">${d.cx.map(c => `<span class="sb-chip sb-chip-candidate" style="font-family:var(--mono);text-align:left;">${esc(c)}</span>`).join('')}</div>
      </div>`);
    }
    if (d.cw.length) {
      parts.push(`<div class="sb-section">
        <div class="sb-section-label">Composes with (${d.cw.length})</div>
        <div class="sb-list">${d.cw.map(f => `<button class="sb-link" data-nav="${esc(f)}">${esc(f)}</button>`).join('')}</div>
      </div>`);
    }
    if (d.cb.length) {
      parts.push(`<div class="sb-section">
        <div class="sb-section-label">Composed by (${d.cb.length})</div>
        <div class="sb-list">${d.cb.map(f => `<button class="sb-link" data-nav="${esc(f)}">${esc(f)}</button>`).join('')}</div>
      </div>`);
    }
    // Drill-through hints per zp-visual-language
    parts.push(`<div class="sb-section">
      <div class="sb-section-label">Drill through</div>
      <div class="sb-list">
        <button class="sb-link" data-lens="abacus">→ See this doc on the Abacus timeline</button>
        <button class="sb-link" data-lens="weave">→ See its composition in Weave</button>
        <button class="sb-link" data-lens="codeflow">→ See its derivation in CodeFlow</button>
      </div>
    </div>`);
    sbContent.innerHTML = parts.join('');
    sbContent.querySelectorAll('[data-nav]').forEach(el => {
      el.addEventListener('click', () => selectDoc(el.dataset.nav));
    });
    sbContent.querySelectorAll('[data-lens]').forEach(el => {
      el.addEventListener('click', () => {
        activeLens = el.dataset.lens;
        document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.dataset.lens === activeLens));
        render();
      });
    });
  }

  // -------- Lens: Abacus --------
  function renderAbacus() {
    const {w, h} = getVBSize();
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    clear(svg);

    hint.innerHTML = 'One <em>bead</em> per doc at its mtime. Wires by subdir. Bead shape shows build state: solid = built, hollow = partial, ring = scaffolded, dashed = candidate.';
    legend.innerHTML = `
      <div class="legend-title">Build state</div>
      <div class="legend-row"><svg width="14" height="14"><circle cx="7" cy="7" r="5" fill="${P.accent}" stroke="${P.accent}"/></svg>built</div>
      <div class="legend-row"><svg width="14" height="14"><circle cx="7" cy="7" r="5" fill="${P.accent}" fill-opacity="0.5" stroke="${P.accent}" stroke-width="1.5"/></svg>partial</div>
      <div class="legend-row"><svg width="14" height="14"><circle cx="7" cy="7" r="5" fill="${P.bg2}" stroke="${P.accent}" stroke-width="1.5"/></svg>scaffolded</div>
      <div class="legend-row"><svg width="14" height="14"><circle cx="7" cy="7" r="5" fill="none" stroke="${P.accent}" stroke-dasharray="2 2"/></svg>candidate</div>
      <div class="legend-title" style="margin-top:6px">Subdir (color)</div>
      <div class="legend-row"><div class="legend-dot" style="background:${P.accent}"></div>docs/ (top)</div>
      <div class="legend-row"><div class="legend-dot" style="background:${P.teal}"></div>docs/design/</div>
      <div class="legend-row"><div class="legend-dot" style="background:${P.lavender}"></div>docs/handoffs/</div>`;

    const pad = { l: 100, r: 40, t: 40, b: 40 };
    const plotW = w - pad.l - pad.r;
    const plotH = h - pad.t - pad.b;

    // Three wires
    const wires = ['', 'design', 'handoffs'];
    const wireH = plotH / wires.length;
    const wireY = i => pad.t + wireH * (i + 0.5);

    // Time scale
    const tRange = tMax - tMin || 1;
    const tScale = t => pad.l + ((t - tMin) / tRange) * plotW;

    // Wire baselines
    wires.forEach((w, i) => {
      const y = wireY(i);
      svg.appendChild(svgEl('line', { x1: pad.l, y1: y, x2: w2? w2: pad.l + plotW, y2: y,
        class: 'axis-line', stroke: P.border, 'stroke-width': 1 }));
      const label = svgEl('text', {
        x: pad.l - 12, y: y - 12, class: 'wire-label',
        'text-anchor': 'end', fill: subdirColor[w]
      });
      label.textContent = `docs/${w ? w + '/' : ''}`;
      svg.appendChild(label);
      const count = M.docs.filter(d => d.sd === w).length;
      const cLabel = svgEl('text', {
        x: pad.l - 12, y: y + 4, class: 'wire-label',
        'text-anchor': 'end', fill: P.dim
      });
      cLabel.textContent = `${count} docs`;
      svg.appendChild(cLabel);
    });
    var w2 = pad.l + plotW; // (function scope hoist for line above)

    // Epoch lines — monthly ticks
    const start = new Date(tMin * 1000);
    const end = new Date(tMax * 1000);
    let m = new Date(start.getFullYear(), start.getMonth(), 1);
    while (m <= end) {
      const t = m.getTime() / 1000;
      if (t >= tMin) {
        const x = tScale(t);
        svg.appendChild(svgEl('line', {
          x1: x, y1: pad.t - 12, x2: x, y2: h - pad.b + 10, class: 'epoch-line'
        }));
        const lab = svgEl('text', { x, y: pad.t - 18, class: 'epoch-label',
          'text-anchor': 'middle' });
        lab.textContent = m.toISOString().slice(0, 7);
        svg.appendChild(lab);
      }
      m = new Date(m.getFullYear(), m.getMonth() + 1, 1);
    }

    // Group docs by wire, filtered by build state, sorted by mtime for deterministic stacking
    const grouped = wires.map(w => M.docs.filter(d => d.sd === w && bsVisible(d)).sort((a, b) => a._t - b._t));

    // Beads
    grouped.forEach((docs, wi) => {
      const baseY = wireY(wi);
      const bins = {};
      docs.forEach(d => {
        const x = Math.round(tScale(d._t) / 10) * 10;
        bins[x] = (bins[x] || 0) + 1;
      });
      const seen = {};
      docs.forEach(d => {
        const x = tScale(d._t);
        const xKey = Math.round(x / 10) * 10;
        seen[xKey] = (seen[xKey] || 0) + 1;
        const stackIdx = seen[xKey] - 1;
        const stackTotal = bins[xKey];
        const jitter = (stackIdx - (stackTotal - 1) / 2) * 6;
        const y = baseY + jitter;

        const color = subdirColor[d.sd] || P.muted;
        const walkedIn = d._t <= walkT;
        const isSelected = selected === d.f;
        const g = svgEl('g', {
          class: 'node' + (isSelected ? ' selected' : '') + (walkedIn ? ' walked' : ' faded')
        });
        g.setAttribute('data-doc', d.f);
        const baseR = d.tr === 1 ? 6 : d.tr === 3 ? 3 : 4;
        const attrs = beadAttrs(d.bs, color, baseR, walkedIn);
        const dot = svgEl('circle', Object.assign({cx: x, cy: y}, attrs));
        g.appendChild(dot);
        g.style.color = color;
        g.addEventListener('click', () => selectDoc(d.f));
        svg.appendChild(g);
      });
    });
  }

  // -------- Lens: Weave --------
  // Radial layout around KEEL (or center). Group by subdir into three wedges.
  function renderWeave() {
    const {w, h} = getVBSize();
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    clear(svg);
    hint.innerHTML = 'Radial authority topology: <em>KEEL</em> at center, elaborations orbit by subdir. Node fill shows build state — hollow = not-built-yet.';
    legend.innerHTML = `
      <div class="legend-title">Build state</div>
      <div class="legend-row"><svg width="14" height="14"><circle cx="7" cy="7" r="5" fill="${P.accent}" stroke="${P.accent}"/></svg>built</div>
      <div class="legend-row"><svg width="14" height="14"><circle cx="7" cy="7" r="5" fill="${P.accent}" fill-opacity="0.5" stroke="${P.accent}" stroke-width="1.5"/></svg>partial</div>
      <div class="legend-row"><svg width="14" height="14"><circle cx="7" cy="7" r="5" fill="${P.bg2}" stroke="${P.accent}" stroke-width="1.5"/></svg>scaffolded</div>
      <div class="legend-row"><svg width="14" height="14"><circle cx="7" cy="7" r="5" fill="none" stroke="${P.accent}" stroke-dasharray="2 2"/></svg>candidate</div>`;

    const cx = w / 2, cy = h / 2;
    const rRing = Math.min(w, h) * 0.36;

    // Filter to walked-in + build-state-visible
    const visible = M.docs.filter(d => d._t <= walkT && bsVisible(d));
    // Order by subdir into three arcs
    const bySd = { '': [], 'design': [], 'handoffs': [] };
    visible.forEach(d => { if (d.f !== M.root) (bySd[d.sd] || bySd['']).push(d); });
    Object.keys(bySd).forEach(k => bySd[k].sort((a,b) => a.f.localeCompare(b.f)));

    // Angle ranges per sector (leave gaps)
    const sectors = [
      { key: '',         a0: -Math.PI * 0.4, a1:  Math.PI * 0.4 },  // right side
      { key: 'design',   a0:  Math.PI * 0.5, a1:  Math.PI * 1.5 },  // left side (bottom→top)
      { key: 'handoffs', a0: -Math.PI * 0.6, a1: -Math.PI * 0.5 },  // small wedge top-right
    ];

    const pos = {};
    pos[M.root] = { x: cx, y: cy };
    sectors.forEach(sec => {
      const arr = bySd[sec.key];
      arr.forEach((d, i) => {
        const t = arr.length === 1 ? 0.5 : i / (arr.length - 1);
        const a = sec.a0 + t * (sec.a1 - sec.a0);
        pos[d.f] = {
          x: cx + Math.cos(a) * rRing,
          y: cy + Math.sin(a) * rRing
        };
      });
    });

    // Draw edges: composes-with among visible nodes
    const seenEdge = new Set();
    visible.forEach(d => {
      d.cw.forEach(t => {
        const key = d.f < t ? d.f + '|' + t : t + '|' + d.f;
        if (seenEdge.has(key)) return;
        seenEdge.add(key);
        const p1 = pos[d.f], p2 = pos[t];
        if (!p1 || !p2) return;
        // Curve slightly toward center
        const mx = (p1.x + p2.x) / 2, my = (p1.y + p2.y) / 2;
        const dx = mx - cx, dy = my - cy;
        const mag = Math.sqrt(dx*dx + dy*dy) || 1;
        const bendX = mx - (dx/mag) * 60;
        const bendY = my - (dy/mag) * 60;
        const path = svgEl('path', {
          d: `M ${p1.x} ${p1.y} Q ${bendX} ${bendY} ${p2.x} ${p2.y}`,
          class: 'edge' + ((selected === d.f || selected === t) ? ' hi' : ''),
          'stroke-dasharray': (d.f === M.root || t === M.root) ? '0' : '3 3'
        });
        svg.appendChild(path);
      });
    });

    // Draw nodes
    Object.keys(pos).forEach(f => {
      const d = byName[f];
      if (!d) return;
      const p = pos[f];
      const color = d.f === M.root ? P.accentBright : (subdirColor[d.sd] || P.muted);
      const isSelected = selected === f;
      const g = svgEl('g', {
        class: 'node' + (isSelected ? ' selected' : ''),
        transform: `translate(${p.x} ${p.y})`
      });
      g.setAttribute('data-doc', f);
      const baseR = f === M.root ? 10 : (d.tr === 1 ? 7 : d.tr === 3 ? 4 : 5);
      const attrs = beadAttrs(d.bs, color, baseR, true);
      const dot = svgEl('circle', Object.assign({cx: 0, cy: 0}, attrs));
      g.appendChild(dot);
      if (f === M.root || isSelected) {
        const label = svgEl('text', {
          x: 0, y: (attrs.r + 14), class: 'node-label',
          fill: f === M.root ? P.accentBright : P.text
        });
        label.textContent = f === M.root ? 'KEEL' : d.f.replace('.md','').substring(0, 32);
        g.appendChild(label);
      }
      g.style.color = color;
      g.addEventListener('click', () => selectDoc(f));
      svg.appendChild(g);
    });
  }

  // -------- Lens: CodeFlow --------
  // Layered DAG: topologically sort by inbound edges, place in columns
  function renderCodeFlow() {
    const {w, h} = getVBSize();
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    clear(svg);
    hint.innerHTML = 'Layered derivation DAG. Columns are BFS depth from KEEL; leaves at the right. Bead shape shows build state — dashed rings are candidates awaiting runtime.';
    legend.innerHTML = `
      <div class="legend-title">Column = derivation depth from KEEL</div>
      <div class="legend-row"><svg width="14" height="14"><circle cx="7" cy="7" r="5" fill="${P.accent}" stroke="${P.accent}"/></svg>built</div>
      <div class="legend-row"><svg width="14" height="14"><circle cx="7" cy="7" r="5" fill="${P.accent}" fill-opacity="0.5" stroke="${P.accent}" stroke-width="1.5"/></svg>partial</div>
      <div class="legend-row"><svg width="14" height="14"><circle cx="7" cy="7" r="5" fill="${P.bg2}" stroke="${P.accent}" stroke-width="1.5"/></svg>scaffolded</div>
      <div class="legend-row"><svg width="14" height="14"><circle cx="7" cy="7" r="5" fill="none" stroke="${P.accent}" stroke-dasharray="2 2"/></svg>candidate</div>`;

    // Filter to nodes with edges + walk + build-state
    const visible = M.docs.filter(d => (d.cw.length || d.cb.length) && d._t <= walkT && bsVisible(d));
    const visibleSet = new Set(visible.map(d => d.f));

    // Compute depth: 0 for pure roots (no outbound), then +1 for each dep
    // Actually invert: KEEL is the ROOT (depth 0); elaborations that reference KEEL are depth 1; further compositions add depth
    // We approximate: BFS from KEEL through composes-with
    const depth = {};
    const queue = [];
    if (visibleSet.has(M.root)) { depth[M.root] = 0; queue.push(M.root); }
    // For nodes that mention KEEL in composes_with, they cite it directly = depth 1
    visible.forEach(d => {
      if (d.cw.includes(M.root)) { depth[d.f] = 1; queue.push(d.f); }
    });
    // BFS forward through composed_by
    while (queue.length) {
      const f = queue.shift();
      const d = byName[f];
      const dep = depth[f];
      d.cb.forEach(child => {
        if (!visibleSet.has(child)) return;
        if (depth[child] === undefined || depth[child] > dep + 1) {
          depth[child] = dep + 1;
          queue.push(child);
        }
      });
    }
    // Remaining nodes not reachable from KEEL: assign to depth 1 (or 2 for handoffs)
    visible.forEach(d => {
      if (depth[d.f] === undefined) depth[d.f] = d.sd === 'handoffs' ? 4 : 2;
    });

    const maxDepth = Math.max(0, ...Object.values(depth));
    const pad = { l: 60, r: 60, t: 40, b: 40 };
    const colW = (w - pad.l - pad.r) / Math.max(1, maxDepth);
    const cols = {};
    visible.forEach(d => {
      const c = depth[d.f];
      (cols[c] = cols[c] || []).push(d);
    });
    Object.keys(cols).forEach(c => cols[c].sort((a,b) => a.f.localeCompare(b.f)));

    const pos = {};
    Object.keys(cols).forEach(c => {
      const arr = cols[c];
      const x = pad.l + parseInt(c) * colW;
      const stepY = (h - pad.t - pad.b) / (arr.length + 1);
      arr.forEach((d, i) => {
        pos[d.f] = { x, y: pad.t + (i + 1) * stepY };
      });
    });

    // Draw edges (composes-with only among visible)
    visible.forEach(d => {
      d.cw.forEach(t => {
        const p1 = pos[d.f], p2 = pos[t];
        if (!p1 || !p2) return;
        const isHi = selected && (selected === d.f || selected === t);
        // Bezier
        const midX = (p1.x + p2.x) / 2;
        const path = svgEl('path', {
          d: `M ${p1.x} ${p1.y} C ${midX} ${p1.y}, ${midX} ${p2.y}, ${p2.x} ${p2.y}`,
          class: 'edge' + (isHi ? ' hi' : ''),
        });
        svg.appendChild(path);
      });
    });

    // Column labels
    Object.keys(cols).forEach(c => {
      const x = pad.l + parseInt(c) * colW;
      const lab = svgEl('text', { x, y: 24, class: 'epoch-label', 'text-anchor': 'middle' });
      lab.textContent = c == 0 ? 'ROOT' : `L${c}`;
      svg.appendChild(lab);
    });

    // Nodes
    visible.forEach(d => {
      const p = pos[d.f];
      const color = d.f === M.root ? P.accentBright : (subdirColor[d.sd] || P.muted);
      const isSelected = selected === d.f;
      const g = svgEl('g', {
        class: 'node' + (isSelected ? ' selected' : ''),
        transform: `translate(${p.x} ${p.y})`
      });
      g.setAttribute('data-doc', d.f);
      const baseR = d.f === M.root ? 8 : (d.tr === 1 ? 6 : d.tr === 3 ? 4 : 5);
      const attrs = beadAttrs(d.bs, color, baseR, true);
      const dot = svgEl('circle', Object.assign({cx: 0, cy: 0}, attrs));
      g.appendChild(dot);
      if (d.f === M.root || isSelected) {
        const label = svgEl('text', {
          x: 0, y: (attrs.r + 14), class: 'node-label',
          fill: d.f === M.root ? P.accentBright : P.text
        });
        label.textContent = d.f === M.root ? 'KEEL' : d.f.replace('.md','').substring(0, 32);
        g.appendChild(label);
      }
      g.style.color = color;
      g.addEventListener('click', () => selectDoc(d.f));
      svg.appendChild(g);
    });
  }

  // -------- Master render dispatcher --------
  function render() {
    switch (activeLens) {
      case 'abacus': renderAbacus(); break;
      case 'weave': renderWeave(); break;
      case 'codeflow': renderCodeFlow(); break;
    }
  }

  // -------- Resize --------
  const ro = new ResizeObserver(render);
  ro.observe(svg.parentElement);

  // Initial lens from URL if given
  if (urlLens && ['abacus','weave','codeflow'].includes(urlLens)) {
    activeLens = urlLens;
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.dataset.lens === urlLens));
  }
  render();
})();
</script>
</body>
</html>
