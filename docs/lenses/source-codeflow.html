<!doctype html>
<html lang="en" data-theme="zp-dark">
<head>
<meta charset="utf-8">
<title>ZeroPoint — Source CodeFlow</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root {
  --bg: #0a0a0c; --bg1: #111116; --bg2: #18181f; --bg3: #1e1e26;
  --surface: #1a1a1f; --border: #222228;
  --text: #e8e8ec; --muted: #8888a0; --dim: #55556a;
  --accent: #7eb8da; --accent-dim: #4a7a96; --accent-bright: #a8d4ee;
  --teal: #94e2d5; --coral: #f87171; --lavender: #a78bfa;
  --saffron: #fbbf24; --sage: #34d399; --rose: #fb923c;
  --font: 'Inter','SF Pro Text',system-ui,-apple-system,sans-serif;
  --mono: 'JetBrains Mono','SF Mono',ui-monospace,monospace;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; overflow: hidden; }
body {
  background: var(--bg); color: var(--text);
  font-family: var(--font); font-size: 13px; line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  display: flex; flex-direction: column;
}
header {
  height: 52px; flex-shrink: 0;
  background: var(--bg1); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 20px; padding: 0 20px;
}
.brand { font-weight: 700; font-size: 14px; letter-spacing: -0.01em; }
.brand .dim { color: var(--muted); font-weight: 400; margin-left: 8px; }
.tabs { display: flex; gap: 4px; }
.tab {
  background: transparent; color: var(--muted);
  border: 1px solid transparent;
  padding: 6px 14px; border-radius: 6px;
  font: inherit; font-size: 12px; font-weight: 500;
  cursor: pointer; letter-spacing: 0.02em;
  transition: color 120ms, background 120ms, border-color 120ms;
}
.tab:hover { color: var(--text); background: var(--bg2); }
.tab.active { color: var(--accent-bright); background: var(--bg2); border-color: var(--accent-dim); }
.tab .q { color: var(--dim); font-weight: 400; margin-left: 6px; font-size: 11px; }
.tab.active .q { color: var(--muted); }
.filter-group { display: flex; align-items: center; gap: 4px; }
.filter-label {
  font-family: var(--mono); font-size: 10px; color: var(--dim);
  text-transform: uppercase; letter-spacing: 0.08em; margin-right: 4px;
}
.filter-chip {
  background: transparent; color: var(--dim);
  border: 1px solid var(--border);
  padding: 3px 10px; border-radius: 999px;
  font: inherit; font-size: 10px; font-family: var(--mono);
  cursor: pointer; letter-spacing: 0.02em;
  transition: color 120ms, background 120ms, border-color 120ms;
}
.filter-chip:hover { color: var(--muted); }
.filter-chip.active { color: var(--text); border-color: var(--accent-dim); background: var(--bg2); }
.filter-chip .dot {
  display: inline-block; width: 6px; height: 6px; border-radius: 50%;
  margin-right: 6px; vertical-align: middle;
}
.spacer { flex: 1; }
.stats { color: var(--muted); font-size: 11px; font-family: var(--mono); }
.stats strong { color: var(--text); font-weight: 500; }

main {
  flex: 1; display: flex; overflow: hidden;
  position: relative;
}
.viewport {
  flex: 1; position: relative;
  overflow: hidden; background: var(--bg);
}
.viewport svg { display: block; width: 100%; height: 100%; }
.viewport-hint {
  position: absolute; top: 16px; left: 16px;
  color: var(--muted); font-size: 11px; font-family: var(--mono);
  pointer-events: none; z-index: 2;
  max-width: 400px;
  background: rgba(17,17,22,0.94); backdrop-filter: blur(6px);
  padding: 8px 12px; border-radius: 6px;
  border: 1px solid var(--border);
}
.viewport-hint em { color: var(--text); font-style: normal; }

aside.sidebar {
  width: 360px; flex-shrink: 0;
  background: var(--bg1); border-left: 1px solid var(--border);
  overflow-y: auto;
  padding: 20px;
  display: flex; flex-direction: column; gap: 16px;
}
.sb-empty { color: var(--dim); font-size: 12px; font-style: italic; }
.sb-title { font-weight: 600; font-size: 14px; letter-spacing: -0.01em; color: var(--text); }
.sb-meta {
  display: flex; flex-wrap: wrap; gap: 6px;
  font-family: var(--mono); font-size: 11px;
}
.sb-chip {
  background: var(--bg2); color: var(--muted);
  padding: 2px 8px; border-radius: 999px;
  border: 1px solid var(--border);
}
.sb-chip.role-signing    { color: var(--accent-bright); border-color: var(--accent-dim); }
.sb-chip.role-gating     { color: var(--saffron); border-color: rgba(251,191,36,0.35); }
.sb-chip.role-chain-emit { color: var(--sage); border-color: rgba(52,211,153,0.35); }
.sb-chip.role-verifying  { color: var(--teal); border-color: rgba(148,226,213,0.35); }
.sb-chip.role-receipt-authoring { color: var(--rose); border-color: rgba(251,146,60,0.35); }
.sb-chip.role-utility    { color: var(--dim); }
.sb-section { display: flex; flex-direction: column; gap: 6px; }
.sb-section-label {
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--dim); font-weight: 600;
}
.sb-list { display: flex; flex-direction: column; gap: 3px; }
.sb-link {
  font-family: var(--mono); font-size: 11px; color: var(--accent);
  text-decoration: none; cursor: pointer;
  padding: 4px 8px; border-radius: 4px;
  background: transparent; border: none; text-align: left;
  width: 100%;
}
.sb-link:hover { background: var(--bg2); color: var(--accent-bright); }
.sb-stat-grid {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px;
  font-family: var(--mono); font-size: 11px;
}
.sb-stat { color: var(--muted); }
.sb-stat strong { color: var(--text); font-weight: 500; font-size: 13px; }

/* SVG element styling */
.node { cursor: pointer; }
.node circle, .node rect {
  transition: opacity 200ms, stroke-width 100ms;
}
.node:hover circle { stroke-width: 2 !important; }
.node.selected circle {
  stroke: var(--accent-bright) !important;
  stroke-width: 3 !important;
}
.node.faded { opacity: 0.15; }
.node-label {
  fill: var(--text); font-family: var(--mono); font-size: 10px;
  pointer-events: none; text-anchor: middle;
}
.node-label.small { font-size: 9px; fill: var(--muted); }
.edge {
  fill: none; stroke-width: 1;
  transition: opacity 200ms;
}
.edge.dep { stroke: var(--dim); opacity: 0.35; }
.edge.dep.hi { stroke: var(--accent); opacity: 0.85; stroke-width: 1.5; }
.edge.overlay-signing    { stroke: var(--accent-bright); stroke-width: 1.5; opacity: 0.55; }
.edge.overlay-gating     { stroke: var(--saffron); stroke-width: 1.5; opacity: 0.55; }
.edge.overlay-chain-emit { stroke: var(--sage); stroke-width: 1.5; opacity: 0.55; }
.edge.overlay-verifying  { stroke: var(--teal); stroke-width: 1.5; opacity: 0.55; }
.edge.overlay-receipt    { stroke: var(--rose); stroke-width: 1.5; opacity: 0.55; }
.edge.overlay-type-flow  { stroke: var(--lavender); stroke-width: 1.5; opacity: 0.7; }
.edge.overlay-type-flow.strong { stroke-width: 2.5; }
.edge.faded { opacity: 0.05; }
.col-label {
  fill: var(--dim); font-family: var(--mono); font-size: 10px;
  text-anchor: middle; text-transform: uppercase; letter-spacing: 0.08em;
}
.legend {
  position: absolute; top: 16px; right: 16px;
  background: rgba(17,17,22,0.94); backdrop-filter: blur(6px);
  border: 1px solid var(--border);
  border-radius: 6px; padding: 10px 12px;
  display: flex; flex-direction: column; gap: 5px;
  font-size: 11px; z-index: 3; max-width: 260px;
}
.legend-title {
  font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--dim); font-weight: 600; margin-bottom: 2px;
}
.legend-row { display: flex; align-items: center; gap: 8px; color: var(--muted); }
.legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
</style>
</head>

  // Type-flow edges are their own graph (not a dep-edge decoration).
  // These edges may or may not correspond to Cargo deps — they reveal shared
  // typed-data channels which are the substrate's implicit communication surface.
  const typeFlowEdges = M.type_flow_edges || [];
  // Cap rendering to top-N edges to avoid noise from long tail
  const TYPE_FLOW_TOP_N = 60;

  function drawTypeFlowEdges(pos) {
    // pos: {crate_name -> {x, y}}
    const top = typeFlowEdges.slice(0, TYPE_FLOW_TOP_N);
    const maxW = Math.max(1, ...top.map(e => e.weight));
    top.forEach(e => {
      const p1 = pos[e.from], p2 = pos[e.to];
      if (!p1 || !p2) return;
      const isHi = selected && (selected === e.from || selected === e.to);
      // Curved edge; arrow head via marker not used — direction implied by color gradient (fixed color)
      const midX = (p1.x + p2.x) / 2;
      const midY = (p1.y + p2.y) / 2;
      // Add a slight arch away from dep edges (perpendicular offset)
      const dx = p2.x - p1.x, dy = p2.y - p1.y;
      const mag = Math.sqrt(dx*dx + dy*dy) || 1;
      const ox = -dy / mag * 30;
      const oy = dx / mag * 30;
      const path = svgEl('path', {
        d: `M ${p1.x} ${p1.y} Q ${midX + ox} ${midY + oy} ${p2.x} ${p2.y}`,
        class: 'edge overlay-type-flow' + (e.weight > maxW * 0.5 ? ' strong' : '') + (isHi ? '' : ''),
      });
      // Opacity scales with edge weight
      path.setAttribute('opacity', String(Math.min(0.9, 0.25 + e.weight / (maxW * 1.5))));
      // Small type-count label at midpoint for strong edges
      if (e.weight > maxW * 0.3 || isHi) {
        const lab = svgEl('text', {
          x: midX + ox, y: midY + oy - 4,
          class: 'node-label small', fill: P.lavender, 'font-family': 'var(--mono)'
        });
        lab.textContent = `${e.weight}`;
        svg.appendChild(path);
        svg.appendChild(lab);
      } else {
        svg.appendChild(path);
      }
    });
  }

  const svg = document.getElementById('canvas');
  const hint = document.getElementById('hint');
  const legend = document.getElementById('legend');
  const stats = document.getElementById('stats');
  const sbEmpty = document.getElementById('sb-empty');
  const sbContent = document.getElementById('sb-content');

  function updateStats() {
    const c = M.counts;
    const tfe = c.total_type_flow_edges || 0;
    const tfs = c.total_type_flow_signal || 0;
    const tds = c.total_type_defs || 0;
    stats.innerHTML = `<strong>${c.total_crates}</strong> crates · <strong>${c.total_deps_edges}</strong> deps · <strong>${tds}</strong> types · <strong>${tfe}</strong> type-flows · <strong>${c.total_sign_sites}</strong> sign · <strong>${c.total_gate_crossings}</strong> gate · <strong>${c.total_chain_emits}</strong> chain · <strong>${c.total_verifications}</strong> verify`;
  }
  updateStats();

  // ---- Empty-state summary in sidebar ----
  function renderEmptyState() {
    const empty = document.getElementById('sb-empty');
    if (!empty) return;
    const topBy = (key, n=5) => M.crates.slice().sort((a,b) => (b[key]||0) - (a[key]||0)).filter(c => c[key] > 0).slice(0, n);
    const roleKeys = {
      'signing': 'sign_count',
      'gating': 'gate_count',
      'chain-emit': 'chain_count',
      'verifying': 'verify_count',
      'receipt-authoring': 'receipt_slug_total',
      'type-flow (out)': 'types_produced_total',
    };
    // Add 'type-flow' as a pseudo-role for the hot-spot summary
    roleColor['type-flow (out)'] = P.lavender;
    roleLabel['type-flow (out)'] = 'type-flow (out — typed data producers)';
    const parts = [`<div class="sb-title" style="font-size:12px;color:var(--muted);font-weight:500;">Info-flow hot spots</div>`];
    Object.keys(roleKeys).forEach(role => {
      const key = roleKeys[role];
      const arr = topBy(key);
      if (!arr.length) return;
      parts.push(`<div class="sb-section">
        <div class="sb-section-label" style="color:${roleColor[role]}">${roleLabel[role]||role}</div>
        <div class="sb-list">${arr.map(c => `<button class="sb-link" data-nav="${esc(c.name)}" style="display:flex;justify-content:space-between;align-items:center;">
          <span>${esc(c.name)}</span>
          <span style="color:var(--dim);font-size:10px;">${c[key]}</span>
        </button>`).join('')}</div>
      </div>`);
    });
    parts.push(`<div style="color:var(--dim);font-size:11px;font-style:italic;padding-top:8px;border-top:1px solid var(--border);">Click any crate for full detail. Toggle overlays in the header to highlight where each info-flow class concentrates.</div>`);
    empty.innerHTML = parts.join('');
    empty.querySelectorAll('[data-nav]').forEach(el => {
      el.addEventListener('click', () => selectCrate(el.dataset.nav));
    });
  }
  renderEmptyState();

  function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
  function clear(el) { while (el.firstChild) el.removeChild(el.firstChild); }
  function svgEl(tag, attrs) {
    const e = document.createElementNS('http://www.w3.org/2000/svg', tag);
    if (attrs) for (const k in attrs) e.setAttribute(k, attrs[k]);
    return e;
  }
  function getVBSize() {
    const r = svg.getBoundingClientRect();
    return { w: r.width, h: r.height };
  }
  // log-scale radius from signal count
  function nodeR(c) {
    const n = c.info_flow_signal;
    if (n === 0) return 6;
    return Math.min(30, 6 + Math.sqrt(n) * 1.2);
  }

  // ---- Tab wiring ----
  document.querySelectorAll('.tab').forEach(t => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
      t.classList.add('active');
      activeLens = t.dataset.lens;
      render();
    });
  });
  document.querySelectorAll('#overlay-filter .filter-chip').forEach(c => {
    c.addEventListener('click', () => {
      const o = c.dataset.overlay;
      if (overlays.has(o)) { overlays.delete(o); c.classList.remove('active'); }
      else { overlays.add(o); c.classList.add('active'); }
      render();
    });
  });

  function selectCrate(name) {
    selected = name;
    render();
    renderSidebar(byName[name]);
  }
  function renderSidebar(c) {
    if (!c) { sbEmpty.style.display='flex'; sbContent.style.display='none'; return; }
    sbEmpty.style.display = 'none';
    sbContent.style.display = 'flex';
    const parts = [];
    parts.push(`<div class="sb-title">${esc(c.name)}</div>`);
    parts.push(`<div class="sb-meta">
      <span class="sb-chip role-${esc(c.primary_role)}">${esc(roleLabel[c.primary_role]||c.primary_role)}</span>
      <span class="sb-chip">${c.files} files</span>
      <span class="sb-chip">${c.loc.toLocaleString()} LOC</span>
    </div>`);
    parts.push(`<div class="sb-section">
      <div class="sb-section-label">Info-flow signals</div>
      <div class="sb-stat-grid">
        <div class="sb-stat"><strong>${c.sign_count}</strong> signing sites</div>
        <div class="sb-stat"><strong>${c.gate_count}</strong> gate crossings</div>
        <div class="sb-stat"><strong>${c.chain_count}</strong> chain emits</div>
        <div class="sb-stat"><strong>${c.verify_count}</strong> verifications</div>
        <div class="sb-stat"><strong>${c.receipt_slug_total}</strong> receipt slugs</div>

    if (c.deps.length) {

        <div class="sb-list">${c.deps.map(d => `<button class="sb-link" data-nav="${esc(d)}">${esc(d)}</button>`).join('')}</div>
      </div>`);
    }
    if (c.consumed_by.length) {
      parts.push(`<div class="sb-section">
        <div class="sb-section-label">Consumed by (${c.consumed_by.length})</div>
        <div class="sb-list">${c.consumed_by.map(d => `<button class="sb-link" data-nav="${esc(d)}">${esc(d)}</button>`).join('')}</div>
      </div>`);
    }
    const fams = Object.entries(c.receipt_families).sort((a,b) => b[1]-a[1]);
    if (fams.length) {
      parts.push(`<div class="sb-section">
        <div class="sb-section-label">Receipt families authored (${fams.length})</div>
        <div class="sb-meta">${fams.map(([n,ct]) => `<span class="sb-chip" title="${ct} references">${esc(n)} · ${ct}</span>`).join('')}</div>
      </div>`);
    }
    if (c.receipt_slugs_sample && c.receipt_slugs_sample.length) {
      parts.push(`<div class="sb-section">
        <div class="sb-section-label">Receipt slug sample</div>
        <div class="sb-list">${c.receipt_slugs_sample.map(s => `<span class="sb-chip" style="font-family:var(--mono);text-align:left;">${esc(s)}</span>`).join('')}</div>
      </div>`);
    }
    // ---- Type-flow detail ----
    if (c.type_defs_count) {
      const prod = c.types_produced ? Object.entries(c.types_produced) : [];
      const cons = c.types_consumed ? Object.entries(c.types_consumed) : [];
      parts.push(`<div class="sb-section">
        <div class="sb-section-label">Type-flow signal (${c.types_produced_total || 0} produced · ${c.types_consumed_total || 0} consumed · ${c.type_defs_count} defined)</div>
      </div>`);
      if (prod.length) {
        parts.push(`<div class="sb-section">
          <div class="sb-section-label" style="color:var(--lavender)">Top types produced (return values)</div>
          <div class="sb-meta">${prod.slice(0,10).map(([n,ct]) => `<span class="sb-chip" style="border-color:rgba(167,139,250,0.3);color:var(--lavender);font-family:var(--mono);" title="${ct} return sites">${esc(n)} · ${ct}</span>`).join('')}</div>
        </div>`);
      }
      if (cons.length) {
        parts.push(`<div class="sb-section">
          <div class="sb-section-label" style="color:var(--lavender)">Top types consumed (function parameters)</div>
          <div class="sb-meta">${cons.slice(0,10).map(([n,ct]) => `<span class="sb-chip" style="border-color:rgba(167,139,250,0.3);color:var(--lavender);font-family:var(--mono);" title="${ct} parameter sites">${esc(n)} · ${ct}</span>`).join('')}</div>
        </div>`);
      }
      // Show which other crates this one flows types to / from
      const outgoing = (M.type_flow_edges || []).filter(e => e.from === c.name).sort((a,b) => b.weight - a.weight).slice(0, 6);
      const incoming = (M.type_flow_edges || []).filter(e => e.to === c.name).sort((a,b) => b.weight - a.weight).slice(0, 6);
      if (outgoing.length) {
        parts.push(`<div class="sb-section">
          <div class="sb-section-label" style="color:var(--lavender)">Type-flow OUT → (${outgoing.length} destinations shown)</div>
          <div class="sb-list">${outgoing.map(e => `<button class="sb-link" data-nav="${esc(e.to)}" style="display:flex;justify-content:space-between;align-items:center;color:var(--lavender);"><span>→ ${esc(e.to)}</span><span style="color:var(--dim);font-family:var(--mono);font-size:10px;">${Object.keys(e.types).slice(0,2).join(', ')}${Object.keys(e.types).length > 2 ? ' +' + (Object.keys(e.types).length-2) : ''} · w=${e.weight}</span></button>`).join('')}</div>
        </div>`);
      }
      if (incoming.length) {
        parts.push(`<div class="sb-section">
          <div class="sb-section-label" style="color:var(--lavender)">Type-flow IN ← (${incoming.length} sources shown)</div>
          <div class="sb-list">${incoming.map(e => `<button class="sb-link" data-nav="${esc(e.from)}" style="display:flex;justify-content:space-between;align-items:center;color:var(--lavender);"><span>← ${esc(e.from)}</span><span style="color:var(--dim);font-family:var(--mono);font-size:10px;">${Object.keys(e.types).slice(0,2).join(', ')}${Object.keys(e.types).length > 2 ? ' +' + (Object.keys(e.types).length-2) : ''} · w=${e.weight}</span></button>`).join('')}</div>
        </div>`);
      }
    }
    sbContent.innerHTML = parts.join('');
    sbContent.querySelectorAll('[data-nav]').forEach(el => {
      el.addEventListener('click', () => selectCrate(el.dataset.nav));
    });
  }

  // ---- Compute dep depth for CodeFlow layout ----
  function computeDepths() {
    // Depth = length of longest dep path from this crate to a foundation crate (no ZP deps).
    // Foundation crates are depth 0; consumers are depth+1 above their deepest dep.
    const depth = {};
    const inDeg = {}; // for topological
    M.crates.forEach(c => { inDeg[c.name] = c.deps.filter(d => byName[d]).length; });
    // Kahn's for topo, computing depth as we go
    const queue = [];
    M.crates.forEach(c => {
      if (inDeg[c.name] === 0) { depth[c.name] = 0; queue.push(c.name); }
    });
    while (queue.length) {
      const n = queue.shift();
      const c = byName[n];
      c.consumed_by.forEach(dep => {
        const cur = depth[dep] === undefined ? -1 : depth[dep];
        depth[dep] = Math.max(cur, (depth[n] || 0) + 1);
        inDeg[dep] -= 1;
        if (inDeg[dep] === 0) queue.push(dep);
      });
    }
    // Any remaining un-visited crates (cycles) get depth 1
    M.crates.forEach(c => { if (depth[c.name] === undefined) depth[c.name] = 1; });
    return depth;
  }
  const DEPTHS = computeDepths();
  const maxDepth = Math.max(...Object.values(DEPTHS));

  // ---- CodeFlow renderer ----
  function renderCodeFlow() {
    const {w, h} = getVBSize();
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    clear(svg);
    hint.innerHTML = 'Source-level CodeFlow. Columns = <em>dep depth</em> — foundation crates left, consumers right. Node size = info-flow signal density. Color = primary role. Toggle overlays to highlight where each info-flow class concentrates. <em>Type-flow</em> edges (lavender, arched) reveal shared-type channels that may cross without a Cargo dep.';
    legend.innerHTML = `
      <div class="legend-title">Primary role (color)</div>
      <div class="legend-row"><div class="legend-dot" style="background:${P.accentBright}"></div>signing (identity, ed25519, HKDF)</div>
      <div class="legend-row"><div class="legend-dot" style="background:${P.saffron}"></div>gating (policy, delegation check)</div>
      <div class="legend-row"><div class="legend-dot" style="background:${P.sage}"></div>chain-emit (append, receipt emit)</div>
      <div class="legend-row"><div class="legend-dot" style="background:${P.teal}"></div>verifying (verify, integrity)</div>
      <div class="legend-row"><div class="legend-dot" style="background:${P.rose}"></div>receipt-authoring (schema slugs)</div>
      <div class="legend-row"><div class="legend-dot" style="background:${P.dim}"></div>utility</div>`;

    // Group by depth
    const cols = {};
    M.crates.forEach(c => {
      const d = DEPTHS[c.name] ?? 1;
      (cols[d] = cols[d] || []).push(c);
    });
    Object.keys(cols).forEach(d => cols[d].sort((a,b) => b.info_flow_signal - a.info_flow_signal));

    const pad = { l: 80, r: 80, t: 60, b: 40 };
    const colW = (w - pad.l - pad.r) / Math.max(1, maxDepth);

    const pos = {};
    Object.keys(cols).forEach(d => {
      const arr = cols[d];
      const x = pad.l + parseInt(d) * colW;
      const stepY = (h - pad.t - pad.b) / (arr.length + 1);
      arr.forEach((c, i) => {
        pos[c.name] = { x, y: pad.t + (i + 1) * stepY, depth: parseInt(d) };
      });
    });

    // ---- Draw dep edges (all crates) ----
    M.crates.forEach(c => {
      c.deps.forEach(d => {
        const p1 = pos[d];        // dep source (further left)
        const p2 = pos[c.name];   // consumer (further right)
        if (!p1 || !p2) return;
        const isSelectedEdge = selected && (selected === c.name || selected === d);
        const midX = (p1.x + p2.x) / 2;
        const path = svgEl('path', {
          d: `M ${p1.x} ${p1.y} C ${midX} ${p1.y}, ${midX} ${p2.y}, ${p2.x} ${p2.y}`,
          class: 'edge dep' + (isSelectedEdge ? ' hi' : (overlays.size ? ' faded' : '')),
        });
        svg.appendChild(path);
      });
    });

    // ---- Overlay edges — for each overlay, draw a colored edge between each pair (dep, consumer)
    // weighted by the *sum* of the class's signal at both ends. This lets you see which dep-chains
    // are heavy in signing / gating / chain-emit / verifying / receipt authoring.
    overlays.forEach(o => {
      if (o === 'type-flow') { drawTypeFlowEdges(pos); return; }
      const sourceKey = overlaySource[o];
      if (!sourceKey) return;
      const edgeClass = (o === 'receipt') ? 'edge overlay-receipt' : ('edge overlay-' + o);
      M.crates.forEach(c => {
        c.deps.forEach(d => {
          const p1 = pos[d];
          const p2 = pos[c.name];
          if (!p1 || !p2) return;
          const other = byName[d];
          if (!other) return;
          const sig = (c[sourceKey] || 0) + (other[sourceKey] || 0);
          if (sig === 0) return;
          const midX = (p1.x + p2.x) / 2;
          const path = svgEl('path', {
            d: `M ${p1.x} ${p1.y} C ${midX} ${p1.y}, ${midX} ${p2.y}, ${p2.x} ${p2.y}`,
            class: edgeClass,
          });
          // Opacity scaled by signal
          path.setAttribute('opacity', String(Math.min(0.9, 0.15 + sig / 40)));
          svg.appendChild(path);
        });
      });
    });

    // ---- Column labels ----
    Object.keys(cols).forEach(d => {
      const x = pad.l + parseInt(d) * colW;
      const label = svgEl('text', { x, y: 30, class: 'col-label' });
      label.textContent = d == 0 ? 'FOUNDATION' : `L${d}`;
      svg.appendChild(label);
    });

    // ---- Nodes ----
    M.crates.forEach(c => {
      const p = pos[c.name];
      if (!p) return;
      const color = roleColor[c.primary_role] || P.muted;
      const r = nodeR(c);
      const isSelected = selected === c.name;
      const isRelated = selected && (byName[selected].deps.includes(c.name) || byName[selected].consumed_by.includes(c.name));
      const g = svgEl('g', {
        class: 'node' + (isSelected ? ' selected' : '') + (selected && !isSelected && !isRelated ? ' faded' : ''),
        transform: `translate(${p.x} ${p.y})`
      });
      g.setAttribute('data-crate', c.name);
      const dot = svgEl('circle', {
        cx: 0, cy: 0, r,
        fill: color,
        'fill-opacity': 0.85,
        stroke: color, 'stroke-width': 1,
      });
      g.appendChild(dot);
      const label = svgEl('text', {
        x: 0, y: r + 12, class: 'node-label', fill: P.text
      });
      label.textContent = c.name;
      g.appendChild(label);
      g.addEventListener('click', () => selectCrate(c.name));
      svg.appendChild(g);
    });
  }

  // ---- Weave renderer (radial dependency topology) ----
  function renderWeave() {
    const {w, h} = getVBSize();
    svg.setAttribute('viewBox', `0 0 ${w} ${h}`);
    clear(svg);
    hint.innerHTML = 'Weave: radial dependency topology. Foundation crates (no deps) at center, consumer crates on outer rings. Ring position = dep depth. Angular position = clustered by primary role.';
    legend.innerHTML = `
      <div class="legend-title">Primary role (color)</div>
      <div class="legend-row"><div class="legend-dot" style="background:${P.accentBright}"></div>signing</div>
      <div class="legend-row"><div class="legend-dot" style="background:${P.saffron}"></div>gating</div>
      <div class="legend-row"><div class="legend-dot" style="background:${P.sage}"></div>chain-emit</div>
      <div class="legend-row"><div class="legend-dot" style="background:${P.teal}"></div>verifying</div>
      <div class="legend-row"><div class="legend-dot" style="background:${P.rose}"></div>receipt-authoring</div>
      <div class="legend-row"><div class="legend-dot" style="background:${P.dim}"></div>utility</div>
      <div class="legend-title" style="margin-top:6px">Ring = dep depth</div>`;

    const cx = w / 2, cy = h / 2;
    const maxR = Math.min(w, h) * 0.42;

    // Group crates by depth
    const ringGroups = {};
    M.crates.forEach(c => {
      const d = DEPTHS[c.name] ?? 1;
      (ringGroups[d] = ringGroups[d] || []).push(c);
    });

    const pos = {};
    // Order within ring by primary role, then by info_flow_signal
    const roleOrder = ['signing','gating','chain-emit','verifying','receipt-authoring','utility'];
    Object.keys(ringGroups).forEach(d => {
      const depth = parseInt(d);
      const ringR = maxR * (depth / maxDepth);
      const arr = ringGroups[d].slice().sort((a,b) => {
        const ai = roleOrder.indexOf(a.primary_role), bi = roleOrder.indexOf(b.primary_role);
        if (ai !== bi) return ai - bi;
        return b.info_flow_signal - a.info_flow_signal;
      });
      arr.forEach((c, i) => {
        const a = (i / arr.length) * Math.PI * 2 - Math.PI / 2;
        pos[c.name] = { x: cx + Math.cos(a) * (depth === 0 ? 0 : ringR), y: cy + Math.sin(a) * (depth === 0 ? 0 : ringR) };
      });
    });
    // Foundation crates cluster at center — spread them a bit
    if (ringGroups[0]) {
      const arr = ringGroups[0];
      const clusterR = Math.min(w, h) * 0.08;
      arr.forEach((c, i) => {
        if (arr.length === 1) { pos[c.name] = { x: cx, y: cy }; return; }
        const a = (i / arr.length) * Math.PI * 2 - Math.PI / 2;
        pos[c.name] = { x: cx + Math.cos(a) * clusterR, y: cy + Math.sin(a) * clusterR };
      });
    }

    // Draw dep edges
    M.crates.forEach(c => {
      c.deps.forEach(d => {
        const p1 = pos[d], p2 = pos[c.name];
        if (!p1 || !p2) return;
        const isHi = selected && (selected === c.name || selected === d);
        const path = svgEl('line', {
          x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y,
          class: 'edge dep' + (isHi ? ' hi' : ''),
        });
        svg.appendChild(path);
      });
    });
    // Overlays
    overlays.forEach(o => {
      const sourceKey = overlaySource[o];
      const edgeClass = (o === 'receipt') ? 'edge overlay-receipt' : ('edge overlay-' + o);
      M.crates.forEach(c => {
        c.deps.forEach(d => {
          const p1 = pos[d], p2 = pos[c.name];
          if (!p1 || !p2) return;
          const other = byName[d];
          const sig = (c[sourceKey] || 0) + (other[sourceKey] || 0);
          if (sig === 0) return;
          const path = svgEl('line', {
            x1: p1.x, y1: p1.y, x2: p2.x, y2: p2.y,
            class: edgeClass,
          });
          path.setAttribute('opacity', String(Math.min(0.9, 0.15 + sig / 40)));
          svg.appendChild(path);
        });
      });
    });

    // Nodes
    M.crates.forEach(c => {
      const p = pos[c.name];
      if (!p) return;
      const color = roleColor[c.primary_role] || P.muted;
      const r = nodeR(c);
      const isSelected = selected === c.name;
      const isRelated = selected && (byName[selected].deps.includes(c.name) || byName[selected].consumed_by.includes(c.name));
      const g = svgEl('g', {
        class: 'node' + (isSelected ? ' selected' : '') + (selected && !isSelected && !isRelated ? ' faded' : ''),
        transform: `translate(${p.x} ${p.y})`
      });
      g.setAttribute('data-crate', c.name);
      const dot = svgEl('circle', {
        cx: 0, cy: 0, r, fill: color, 'fill-opacity': 0.85,
        stroke: color, 'stroke-width': 1,
      });
      g.appendChild(dot);
      const label = svgEl('text', {
        x: 0, y: r + 12, class: 'node-label', fill: P.text
      });
      label.textContent = c.name;
      g.appendChild(label);
      g.addEventListener('click', () => selectCrate(c.name));
      svg.appendChild(g);
    });
  }

  function render() {
    if (activeLens === 'codeflow') renderCodeFlow();
    else if (activeLens === 'weave') renderWeave();
  }

  const ro = new ResizeObserver(render);
  ro.observe(svg.parentElement);

  const urlParams = new URLSearchParams(location.search);
  const urlLens = urlParams.get('lens');
  if (urlLens && ['codeflow','weave'].includes(urlLens)) {
    activeLens = urlLens;
    document.querySelectorAll('.tab').forEach(x => x.classList.toggle('active', x.dataset.lens === urlLens));
  }
  const urlOverlay = urlParams.get('overlay');
  if (urlOverlay) {
    urlOverlay.split(',').forEach(o => {
      overlays.add(o);
      const chip = document.querySelector(`.filter-chip[data-overlay="${o}"]`);
      if (chip) chip.classList.add('active');
    });
  }
  render();
})();
</script>
</body>
</html>
