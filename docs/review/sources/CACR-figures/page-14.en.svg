<line x1="60" y1="1056" x2="1560" y2="1056" stroke="#d8d8d4" stroke-width="1"/>
<text x="60" y="1090" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#3f3f3f"><tspan font-weight="700" fill="#1a1a1a">Reading the figure.</tspan> The model is concentric, not stacked. GB/T 39786-2021's requirement set is the core and the guideline surrounds it — its authority is entirely</text>
<text x="60" y="1109" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#3f3f3f">derived. Appendix C carries the explicit mapping table between the two.</text>
<text x="60" y="1139" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#3f3f3f"><tspan font-weight="700" fill="#1a1a1a">The ellipsis is the document's.</tspan> Every box in the original ends with “…”. These are worked examples of the tiering, not closed enumerations of what belongs to each tier.</text>
<text x="60" y="1169" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#3f3f3f"><tspan font-weight="700" fill="#1a1a1a">Two placements worth noting (marked in red).</tspan> Agent security is BASELINE — interaction-protocol security and monitoring/audit are expected of every deployment. Zero-knowledge proof is</text>
<text x="60" y="1188" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" fill="#3f3f3f">ENHANCED-only, which places §8.5.2.4(a)'s pre-execution plan credential at the enhanced tier by the document's own scheme.</text>
</svg>