<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; height: 100%; }
body {
  background: #0a0a0c;
  color: #e8e8ec;
  font-family: 'Inter','SF Pro Text',system-ui,-apple-system,sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
  transition: background 200ms ease, color 200ms ease;
}
.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 12px 20px;
  border-bottom: 1px solid #222228;
  background: #0a0a0c;
  position: sticky; top: 0; z-index: 10;
}
.topbar .title { font-weight: 700; font-size: 14px; letter-spacing: 0.01em; }
.topbar .spacer { flex: 1; }
.toolbar { display: flex; align-items: center; gap: 6px; }
.toolbar-sep {
  width: 1px; height: 20px; background: #222228;
  margin: 0 4px;
}
.btn {
  background: #1a1a1f; color: #e8e8ec;
  border: 1px solid #222228;
  padding: 6px 14px; border-radius: 8px;
  font: inherit; font-size: 12px; font-weight: 500;
  letter-spacing: 0.02em;
  cursor: pointer;
  transition: background 120ms ease, border-color 120ms ease;
}
.btn:hover { border-color: #7eb8da; }
.btn:active { transform: translateY(1px); }
.btn-primary {
  background: #7eb8da; color: #0a0a0c;
  border-color: #7eb8da;
}
.btn-primary:hover { filter: brightness(1.08); }
.icon-btn {
  width: 32px; padding: 6px 0;
  display: inline-flex; align-items: center; justify-content: center;
  font-size: 14px;
}
.theme-icon { line-height: 1; }
.canvas {
  width: 100%;
  padding: 24px;
  overflow: auto;
}
.svg-host { width: 100%; }
.svg-host svg { display: block; max-width: 100%; height: auto; }

.editor {
  position: fixed; right: 0; top: 0; height: 100vh;
  width: min(520px, 92vw);
  transform: translateX(100%);
  transition: transform 220ms ease;
  background: #1a1a1f;
  border-left: 1px solid #222228;
  display: flex; flex-direction: column;
  z-index: 20;
  box-shadow: -8px 0 24px rgba(0,0,0,0.15);
}
.editor.open { transform: translateX(0); }
.editor-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 18px;
  border-bottom: 1px solid #222228;
}
.editor-actions { display: flex; gap: 8px; }
#json-source {
  flex: 1;
  background: #0a0a0c;
  color: #e8e8ec;
  border: none;
  padding: 16px 18px;
  font-family: 'JetBrains Mono','SF Mono',ui-monospace,monospace;
  font-size: 12px;
  line-height: 1.5;
  resize: none;
  outline: none;
}
.editor-status {
  padding: 8px 18px; font-size: 12px; color: #8888a0;
  border-top: 1px solid #222228;
}

/* Print — strip chrome for clean PDF via Save-as-PDF from the print dialog. */
@media print {
  .topbar, .editor { display: none !important; }
  body { background: #ffffff; }
  .canvas { padding: 0; overflow: visible; }
  .svg-host svg { width: 100%; height: auto; }
  @page { size: landscape; margin: 12mm; }
}
</style>
