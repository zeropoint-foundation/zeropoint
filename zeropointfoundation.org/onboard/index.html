<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ZeroPoint Foundation — Director Onboarding</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0a0a0f;
    --bg-panel: #12121a;
    --bg-elevated: #18181f;
    --border: #222233;
    --border-soft: #1a1a28;
    --text: #e0e0e8;
    --text-dim: #888898;
    --text-faint: #5a5a6a;
    --text-bright: #ffffff;
    --accent: #4a9eff;
    --accent-soft: rgba(74, 158, 255, 0.08);
    --green: #3ddc84;
    --red: #ff6b6b;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --mono: 'JetBrains Mono', 'SF Mono', 'Fira Code', ui-monospace, monospace;
  }

  body {
    font-family: var(--font);
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 24px;
    line-height: 1.55;
    font-size: 15px;
    -webkit-font-smoothing: antialiased;
  }

  .wordmark {
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--text-faint);
    font-size: 12px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 32px;
    user-select: none;
  }
  .wordmark .glyph {
    width: 8px; height: 8px;
    background: var(--accent);
    transform: rotate(45deg);
    display: inline-block;
  }

  .card {
    width: 100%;
    max-width: 560px;
    background: var(--bg-panel);
    border: 1px solid var(--border-soft);
    border-radius: 12px;
    padding: 56px 56px 48px;
    position: relative;
    overflow: hidden;
  }
  @media (max-width: 560px) {
    .card { padding: 36px 24px 32px; }
  }

  .phase {
    animation: phase-in 0.5s cubic-bezier(0.16, 1, 0.3, 1) both;
  }
  @keyframes phase-in {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  h1 {
    font-size: 28px;
    font-weight: 600;
    color: var(--text-bright);
    letter-spacing: -0.02em;
    line-height: 1.2;
    margin-bottom: 20px;
  }
  h2 {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.06em;
    margin-bottom: 18px;
  }
  p { margin-bottom: 16px; color: var(--text); }
  p.dim { color: var(--text-dim); font-size: 14px; }

  /* ── Steward's voice ── */
  .steward {
    border-left: 2px solid var(--accent);
    padding-left: 18px;
    margin-bottom: 32px;
  }
  .steward-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--accent);
    font-weight: 600;
    margin-bottom: 12px;
    opacity: 0.8;
  }
  .steward p {
    color: var(--text-dim);
    font-size: 15px;
    line-height: 1.7;
    margin-bottom: 10px;
  }
  .steward p:last-child { margin-bottom: 0; }

  /* ── Director picker ── */
  .picker {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin: 28px 0 32px;
  }
  .picker button {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 14px 20px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 15px;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .picker button:hover { border-color: var(--accent); }
  .picker button[data-selected="true"] {
    border-color: var(--accent);
    background: var(--accent-soft);
  }
  .picker .role { color: var(--text-dim); font-size: 13px; text-transform: capitalize; }

  /* ── Buttons ── */
  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 12px 24px;
    border-radius: 8px;
    font-family: inherit;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.05s;
  }
  .btn:hover { opacity: 0.92; }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: 0.35; cursor: not-allowed; }
  .btn-secondary {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { color: var(--text); border-color: var(--text-dim); }
  .actions {
    display: flex;
    gap: 12px;
    margin-top: 24px;
    align-items: center;
  }

  /* ── Working spinner ── */
  .working {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 36px 0 24px;
  }
  .pulse {
    width: 48px; height: 48px;
    border-radius: 50%;
    border: 2px solid var(--border);
    border-top-color: var(--accent);
    animation: spin 1.2s linear infinite;
    margin-bottom: 24px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .working-label { color: var(--text-dim); font-size: 13px; }

  /* ── Fingerprint ── */
  .fingerprint {
    font-family: var(--mono);
    font-size: 22px;
    color: var(--accent);
    letter-spacing: 0.08em;
    margin: 20px 0;
    text-align: center;
    word-break: break-all;
  }
  .fingerprint-note {
    text-align: center;
    color: var(--text-dim);
    font-size: 13px;
    margin-top: -8px;
    margin-bottom: 20px;
  }

  /* ── Recovery phrase ── */
  .mnemonic-warning {
    background: rgba(255, 107, 107, 0.05);
    border: 1px solid rgba(255, 107, 107, 0.2);
    border-radius: 8px;
    padding: 12px 16px;
    color: var(--red);
    font-size: 13px;
    margin-bottom: 16px;
  }
  .mnemonic-box {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 24px 20px;
    margin: 16px 0;
    font-family: var(--mono);
    font-size: 14px;
  }
  .mnemonic-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px 16px;
  }
  @media (max-width: 480px) { .mnemonic-grid { grid-template-columns: repeat(2, 1fr); } }
  .mnemonic-word { display: flex; gap: 8px; align-items: baseline; }
  .mnemonic-num { color: var(--text-faint); font-size: 11px; min-width: 18px; text-align: right; }
  .mnemonic-text { color: var(--text-bright); }

  .confirm {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    padding: 16px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: border-color 0.15s;
  }
  .confirm:hover { border-color: var(--text-dim); }
  .confirm input { margin-top: 3px; flex-shrink: 0; }
  .confirm label { cursor: pointer; color: var(--text); font-size: 14px; }

  /* ── Voice selection ── */
  .voice-grid {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin: 20px 0 28px;
  }
  .voice-card {
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    cursor: pointer;
    transition: border-color 0.15s, background 0.15s;
    gap: 12px;
  }
  .voice-card:hover { border-color: var(--accent); }
  .voice-card.selected { border-color: var(--accent); background: var(--accent-soft); }
  .voice-info { flex: 1; }
  .voice-name { font-weight: 500; color: var(--text-bright); font-size: 14px; }
  .voice-desc { color: var(--text-dim); font-size: 13px; margin-top: 2px; }
  .voice-play {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    border-radius: 6px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
    transition: border-color 0.15s, color 0.15s;
    flex-shrink: 0;
    font-family: inherit;
  }
  .voice-play:hover { border-color: var(--text-dim); color: var(--text); }
  .voice-play.playing { border-color: var(--accent); color: var(--accent); }

  /* ── Capability demo ── */
  .demo-panels {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin: 20px 0;
  }
  .demo-panel {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 16px 20px;
  }
  .demo-panel-label {
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-faint);
    margin-bottom: 6px;
  }
  .demo-panel-action { color: var(--text); font-size: 14px; margin-bottom: 12px; }
  .demo-result {
    font-family: var(--mono);
    font-size: 13px;
    margin-top: 12px;
    padding-top: 12px;
    border-top: 1px solid var(--border-soft);
  }
  .demo-result .mark { font-weight: 600; margin-right: 8px; }
  .demo-result .mark.allow { color: var(--green); }
  .demo-result .mark.deny  { color: var(--red); }
  .demo-result .outcome-note { color: var(--text-dim); font-size: 12px; margin-top: 4px; }

  /* ── Capability list ── */
  .caps { list-style: none; margin: 16px 0 24px; padding: 0; }
  .caps li {
    padding: 8px 0;
    color: var(--text);
    border-bottom: 1px solid var(--border-soft);
    display: flex;
    gap: 12px;
    align-items: baseline;
  }
  .caps li:last-child { border-bottom: none; }
  .caps li::before { content: "—"; color: var(--text-faint); flex-shrink: 0; }

  /* ── Handoff summary ── */
  .summary {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    overflow: hidden;
    margin: 16px 0 24px;
  }
  .summary-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    padding: 10px 16px;
    border-bottom: 1px solid var(--border-soft);
    font-size: 14px;
    gap: 12px;
  }
  .summary-row:last-child { border-bottom: none; }
  .summary-key { color: var(--text-dim); flex-shrink: 0; }
  .summary-val { color: var(--text-bright); font-family: var(--mono); font-size: 13px; text-align: right; word-break: break-all; }
  .summary-val.plain { font-family: inherit; font-size: 14px; }

  .receipt-count {
    color: var(--text-dim);
    font-size: 13px;
    margin-top: -8px;
    margin-bottom: 24px;
  }

  /* ── Phase indicator ── */
  .phase-indicator {
    margin-top: 36px;
    display: flex;
    gap: 8px;
    justify-content: center;
  }
  .dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--border);
    transition: background 0.3s, transform 0.3s;
  }
  .dot.active   { background: var(--accent); transform: scale(1.3); }
  .dot.complete { background: var(--text-dim); }

  /* ── Misc ── */
  .helper {
    margin-top: 24px;
    color: var(--text-faint);
    font-size: 13px;
    text-align: center;
  }
  .error {
    margin-top: 16px;
    padding: 12px 16px;
    background: rgba(255, 107, 107, 0.06);
    border: 1px solid rgba(255, 107, 107, 0.3);
    border-radius: 8px;
    color: var(--red);
    font-size: 13px;
  }
</style>
</head>
<body>
  <div class="wordmark">
    <span class="glyph"></span>
    <span>ZeroPoint Foundation</span>
  </div>

  <div class="card" id="card"><!-- rendered by JS --></div>

  <div class="phase-indicator" id="indicator">
    <span class="dot" data-phase="0"></span>
    <span class="dot" data-phase="1"></span>
    <span class="dot" data-phase="2"></span>
    <span class="dot" data-phase="3"></span>
    <span class="dot" data-phase="4"></span>
    <span class="dot" data-phase="5"></span>
  </div>

<script type="module">
import { BIP39_WORDS } from "./bip39.js";

// ─── State ───────────────────────────────────────────────────────────
const state = {
  operator: null,       // { id, name, role }
  token: null,          // bearer
  keyPair: null,        // CryptoKeyPair
  publicKeyHex: null,   // 64-char hex
  fingerprint: null,    // "xxxx…xxxx"
  mnemonic: null,       // string[24]
  me: null,             // /api/me payload
  voiceId: "bm_george", // selected Kokoro voice
  receiptIds: [],
  receiptLabels: [],    // human-readable label per receipt
};

const card      = document.getElementById("card");
const indicator = document.getElementById("indicator");

// ─── Voices ──────────────────────────────────────────────────────────
const VOICES = [
  { id: "bm_george",   name: "George",   desc: "British male, warm — the closest to the Jarvis reference", default: true },
  { id: "bm_fable",    name: "Fable",    desc: "British male, slightly drier timbre" },
  { id: "bf_isabella", name: "Isabella", desc: "British female, professional" },
  { id: "am_michael",  name: "Michael",  desc: "American male, neutral / modern" },
  { id: "af_nicole",   name: "Nicole",   desc: "American female, warm" },
];

// ─── Per-role copy ───────────────────────────────────────────────────
const ROLE_COPY = {
  executive_director: {
    title: "Executive Director",
    abilities: [
      "Send and read mail across every Foundation address",
      "Create, edit, and manage all Foundation documents",
      "Approve and publish media",
      "Register new operators and read the full audit trail",
      "Take any action the Foundation needs",
    ],
    demoAllowed: { path: "/api/mail/info", cap: "mail:read:info",   label: "Read shared correspondence (info@)" },
    demoDenied:  { path: "/api/receipts",  cap: "succession:invoke", label: "Invoke succession (precondition gate)" },
  },
  treasurer: {
    title: "Treasurer",
    abilities: [
      "Read every Foundation mailbox",
      "Send and manage your own mailbox",
      "Read and write Foundation documents",
      "Track tasks and commitments",
      "Read the Foundation's audit trail",
    ],
    demoAllowed: { path: "/api/mail/info",     cap: "mail:read:info",      label: "Read shared correspondence" },
    demoDenied:  { path: "/api/operators",     cap: "workspace:admin",      label: "List all operators (admin only)" },
  },
  secretary: {
    title: "Secretary",
    abilities: [
      "Read every Foundation mailbox",
      "Send and manage your own mailbox",
      "Read and write Foundation documents",
      "Track tasks and follow-ups",
      "Read the Foundation's audit trail",
    ],
    demoAllowed: { path: "/api/mail/info",     cap: "mail:read:info",      label: "Read shared correspondence" },
    demoDenied:  { path: "/api/operators",     cap: "workspace:admin",      label: "List all operators (admin only)" },
  },
  director: {
    title: "Director",
    abilities: [
      "Read and send mail from your own mailbox",
      "Read shared correspondence (info@ and board@)",
      "Read Foundation documents",
      "Read your own activity in the audit trail",
    ],
    demoAllowed: { path: "/api/mail/info",     cap: "mail:read:info",      label: "Read shared correspondence" },
    demoDenied:  null, // filled dynamically — read another director's private mail
  },
};
ROLE_COPY.advisor  = { ...ROLE_COPY.director, title: "Advisor" };
ROLE_COPY.staff    = { ...ROLE_COPY.director, title: "Staff" };

// ─── Phase indicator ─────────────────────────────────────────────────
// Maps internal step → dot index (0-5)
// welcome | identity+register | recovery | passkey | voice | bound
const INDICATOR_MAP = {
  welcome:   0,
  identity:  1,
  register:  1,
  recovery:  2,
  passkey:   3,
  voice:     4,
  bound:     5,
  handoff:   5,
};
function setIndicator(step) {
  const target = INDICATOR_MAP[step] ?? 0;
  for (const dot of indicator.querySelectorAll(".dot")) {
    const i = parseInt(dot.dataset.phase, 10);
    dot.classList.toggle("active",   i === target);
    dot.classList.toggle("complete", i < target);
  }
}

// ─── API helpers ─────────────────────────────────────────────────────
async function api(path, opts = {}) {
  const headers = { "Content-Type": "application/json", ...(opts.headers || {}) };
  if (state.token) headers["Authorization"] = `Bearer ${state.token}`;
  const res = await fetch(path, { ...opts, headers });
  return { res, body: await res.json().catch(() => null) };
}

async function emit(step, claim, status, metadata = {}, label = "") {
  const { body } = await api("/api/onboard/progress", {
    method: "POST",
    body: JSON.stringify({ step, claim, status, metadata }),
  });
  if (body?.receiptId) {
    state.receiptIds.push(body.receiptId);
    state.receiptLabels.push(label || claim);
  }
  return body;
}

// ─── Crypto ──────────────────────────────────────────────────────────
function bytesToHex(bytes) {
  return [...new Uint8Array(bytes)].map(b => b.toString(16).padStart(2, "0")).join("");
}
function base64urlDecode(str) {
  str = str.replace(/-/g, "+").replace(/_/g, "/");
  while (str.length % 4) str += "=";
  const bin = atob(str);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return bytes;
}
function bufToBase64url(buf) {
  const bytes = new Uint8Array(buf);
  let s = "";
  for (const b of bytes) s += String.fromCharCode(b);
  return btoa(s).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
}
function base64urlToBuf(s) {
  s = s.replace(/-/g, "+").replace(/_/g, "/");
  while (s.length % 4) s += "=";
  const bin = atob(s);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out.buffer;
}
function fingerprint(hex) {
  return `${hex.slice(0, 4)}…${hex.slice(-4)}`;
}
async function generateIdentity() {
  let keyPair;
  try {
    keyPair = await crypto.subtle.generateKey({ name: "Ed25519" }, true, ["sign", "verify"]);
  } catch {
    throw new Error(
      "This browser doesn't support the cryptography we need. " +
      "Try a recent version of Chrome, Firefox, Safari, or Edge."
    );
  }
  const rawPub  = await crypto.subtle.exportKey("raw", keyPair.publicKey);
  const jwkPriv = await crypto.subtle.exportKey("jwk", keyPair.privateKey);
  const seed     = base64urlDecode(jwkPriv.d);
  const pubHex   = bytesToHex(rawPub);
  const mnemonic = await mnemonicFromSeed(seed);
  return { keyPair, publicKeyHex: pubHex, mnemonic };
}
async function mnemonicFromSeed(seed) {
  if (seed.length !== 32) throw new Error("BIP39: expected 32 bytes");
  const hashBuffer    = await crypto.subtle.digest("SHA-256", seed);
  const checksumByte  = new Uint8Array(hashBuffer)[0];
  let bits = 0n;
  for (const b of seed) bits = (bits << 8n) | BigInt(b);
  bits = (bits << 8n) | BigInt(checksumByte);
  const words = [];
  for (let i = 23; i >= 0; i--) words.push(BIP39_WORDS[Number((bits >> BigInt(i * 11)) & 0x7ffn)]);
  return words;
}

// ─── Passkey helpers ─────────────────────────────────────────────────
function inferDeviceName() {
  const ua = navigator.userAgent || "";
  if (/iPhone/.test(ua)) return "iPhone";
  if (/iPad/.test(ua)) return "iPad";
  if (/Android/.test(ua)) return "Android";
  if (/Mac OS X/.test(ua)) return "Mac";
  if (/Windows/.test(ua)) return "Windows PC";
  return "this device";
}
async function registerPasskey() {
  const optsRes = await api("/api/auth/webauthn/register/options", { method: "POST" });
  if (!optsRes.res.ok) throw new Error(optsRes.body?.error || "Couldn't start setup");
  const opts = optsRes.body;
  const publicKey = {
    ...opts,
    challenge: base64urlToBuf(opts.challenge),
    user: { ...opts.user, id: base64urlToBuf(opts.user.id) },
    excludeCredentials: (opts.excludeCredentials || []).map(c => ({ ...c, id: base64urlToBuf(c.id) })),
  };
  const cred = await navigator.credentials.create({ publicKey });
  if (!cred) throw new Error("Setup cancelled");
  const credJson = {
    id: cred.id,
    rawId: bufToBase64url(cred.rawId),
    type: cred.type,
    response: {
      clientDataJSON: bufToBase64url(cred.response.clientDataJSON),
      attestationObject: bufToBase64url(cred.response.attestationObject),
      transports: cred.response.getTransports?.() || [],
    },
  };
  const verifyRes = await api("/api/auth/webauthn/register/verify", {
    method: "POST",
    body: JSON.stringify({ credential: credJson, deviceName: inferDeviceName() }),
  });
  if (!verifyRes.res.ok) throw new Error(verifyRes.body?.error || "Couldn't finish setup");
}

// ─── Misc ────────────────────────────────────────────────────────────
function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }
function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
}
function stewardHtml(...paras) {
  return `<div class="steward"><div class="steward-label">Steward</div>${paras.map(p => `<p>${p}</p>`).join("")}</div>`;
}

// ══════════════════════════════════════════════════════════════════════
// Phase 1 — Welcome
// ══════════════════════════════════════════════════════════════════════
async function renderWelcome() {
  setIndicator("welcome");

  card.innerHTML = `
    <div class="phase">
      <h2>Welcome</h2>
      <h1>ZeroPoint Foundation</h1>
      ${stewardHtml(
        "Welcome to ZeroPoint Foundation onboarding. I'm Steward — the Foundation's assistant. To begin, identify yourself from the list below."
      )}
      <div class="picker" id="picker"><div class="working-label">Loading…</div></div>
      <div class="actions"><button class="btn" id="continue" disabled>Continue</button></div>
    </div>
  `;

  const picker = document.getElementById("picker");
  const cont   = document.getElementById("continue");

  const { res, body } = await api("/api/operators/active");
  const ops = body?.operators ?? [];
  if (!res.ok || !ops.length) {
    picker.innerHTML = `<div class="error">Couldn't load the director list. Refresh and try again.</div>`;
    return;
  }
  picker.innerHTML = "";
  let selected = null;
  for (const op of ops) {
    const btn = document.createElement("button");
    btn.dataset.id = op.id;
    const roleLabel = (op.role || "").replace("_", " ");
    btn.innerHTML = `<span>${escapeHtml(op.name)}</span><span class="role">${escapeHtml(roleLabel)}</span>`;
    btn.addEventListener("click", () => {
      selected = op;
      picker.querySelectorAll("button").forEach(b => {
        b.dataset.selected = String(b.dataset.id === op.id);
      });
      cont.disabled = false;
    });
    picker.appendChild(btn);
  }

  cont.addEventListener("click", async () => {
    if (!selected) return;
    cont.disabled = true;
    state.operator = selected;

    // Acquire a session token
    const { body: sess } = await api("/api/auth/session", {
      method: "POST",
      body: JSON.stringify({ operatorId: selected.id }),
    });
    if (!sess?.token) {
      picker.insertAdjacentHTML("afterend",
        `<div class="error">Couldn't sign you in. Ask Ken to check things on his end.</div>`);
      cont.disabled = false;
      return;
    }
    state.token = sess.token;

    // Check if already fully onboarded
    const { body: me } = await api("/api/me");
    if (me?.registered) {
      card.innerHTML = `
        <div class="phase">
          <h2>Already registered</h2>
          <h1>${escapeHtml(selected.name)}</h1>
          ${stewardHtml(
            `${escapeHtml(selected.name)}, your operator identity is already bound to a real key.
             If you're trying to recover access or re-onboard, that's a different flow.
             I'll log the attempt and flag it for review.`
          )}
        </div>
      `;
      await emit(1, "onboard:start:already-onboarded", "completed",
        { name: selected.name }, "Already onboarded — flagged");
      return;
    }

    await emit(1, "onboard:start", "completed", { name: selected.name, role: selected.role }, "Onboarding started");

    // Show Steward's greeting now that we know who this is
    card.innerHTML = `
      <div class="phase">
        <h2>Welcome</h2>
        <h1>Hello, ${escapeHtml(selected.name.split(" ")[0])}.</h1>
        ${stewardHtml(
          `Before we begin: this ceremony establishes your cryptographic identity with the Foundation.
           Three things will happen — you'll generate a keypair, record a recovery path,
           and demonstrate how your authority works. Each step is yours to take.
           The whole flow runs about fifteen minutes.`,
          "Your call: proceed when ready."
        )}
        <div class="actions"><button class="btn" id="begin">Begin</button></div>
      </div>
    `;
    document.getElementById("begin").addEventListener("click", renderIdentity);
  });
}

// ══════════════════════════════════════════════════════════════════════
// Phase 2 — Identity
// ══════════════════════════════════════════════════════════════════════
async function renderIdentity() {
  setIndicator("identity");

  card.innerHTML = `
    <div class="phase">
      <h2>Identity</h2>
      <h1>Your cryptographic identity</h1>
      ${stewardHtml(
        "Now I'll generate your cryptographic identity. The keypair is created on this device, in your browser, using Web Crypto. The private key never leaves this machine — not to me, not to the substrate, not to anyone.",
        "Your public key becomes your authority for every action you take in the Foundation. The private key is what proves it's you.",
        "Your call: proceed."
      )}
      <div class="actions"><button class="btn" id="generate">Generate</button></div>
      <div id="out"></div>
    </div>
  `;

  document.getElementById("generate").addEventListener("click", async () => {
    const genBtn = document.getElementById("generate");
    const out    = document.getElementById("out");
    genBtn.disabled = true;
    out.innerHTML = `<div class="working" style="padding:28px 0 0;"><div class="pulse"></div><div class="working-label">Generating on this device…</div></div>`;

    const minDuration = 1200;
    const start = Date.now();
    let identity;
    try {
      identity = await generateIdentity();
    } catch (err) {
      out.innerHTML = `<div class="error">${escapeHtml(err.message)}</div>`;
      await emit(2, "onboard:identity:browser-unsupported", "failed",
        { error: err.message }, "Browser unsupported");
      return;
    }
    const elapsed = Date.now() - start;
    if (elapsed < minDuration) await sleep(minDuration - elapsed);

    state.keyPair      = identity.keyPair;
    state.publicKeyHex = identity.publicKeyHex;
    state.fingerprint  = fingerprint(identity.publicKeyHex);
    state.mnemonic     = identity.mnemonic;

    // Show the fingerprint and ask them to look at it
    out.innerHTML = `
      <div class="fingerprint">${escapeHtml(state.fingerprint)}</div>
      <p class="fingerprint-note">Glance at the first and last four characters.
        Those are how you'll recognize your real key on this device in the future.
        If anything ever shows a different fingerprint, stop and tell me.</p>
      <div class="actions" style="margin-top:8px;">
        <button class="btn" id="fp-cont">I see it — continue</button>
      </div>
    `;

    document.getElementById("fp-cont").addEventListener("click", async () => {
      document.getElementById("fp-cont").disabled = true;
      await emit(2, "onboard:identity:generated", "completed",
        { fingerprint: state.fingerprint }, "Identity generated");
      await renderRegister();
    });
  });
}

// ══════════════════════════════════════════════════════════════════════
// Phase 3 — Register
// ══════════════════════════════════════════════════════════════════════
async function renderRegister() {
  setIndicator("register");

  card.innerHTML = `
    <div class="phase">
      <h2>Register</h2>
      <h1>Bind your key to the Foundation</h1>
      ${stewardHtml(
        `Now I'll register your public key with the substrate, replacing the placeholder
         that's been holding your operator slot. This is a one-shot operation — once it
         succeeds, your key is your authority for every action you take here.
         The placeholder gets retired; future registration attempts on your operator-id will be refused.`,
        "Your call: register now."
      )}
      <div class="actions"><button class="btn" id="register">Register</button></div>
      <div id="out"></div>
    </div>
  `;

  document.getElementById("register").addEventListener("click", async () => {
    const regBtn = document.getElementById("register");
    const out    = document.getElementById("out");
    regBtn.disabled = true;
    out.innerHTML = `<div class="working" style="padding:24px 0 0;"><div class="pulse" style="width:36px;height:36px;border-width:1.5px;"></div><div class="working-label">Recording your identity…</div></div>`;

    const minDuration = 1100;
    const start = Date.now();
    const reg = await api("/api/onboard/register-identity", {
      method: "POST",
      body: JSON.stringify({ publicKeyHex: state.publicKeyHex }),
    });
    const elapsed = Date.now() - start;
    if (elapsed < minDuration) await sleep(minDuration - elapsed);

    if (!reg.res.ok && reg.res.status !== 409) {
      if (reg.res.status === 403 && reg.body?.error?.includes("real key")) {
        out.innerHTML = `
          <div class="error">Registration refused. Your operator slot already has a real key.
          If that's wrong, this is a real incident — tell me now and I'll surface it to Ken.</div>
        `;
        await emit(3, "onboard:identity:registration-refused", "failed",
          { status: reg.res.status }, "Registration refused — already registered");
        return;
      }
      out.innerHTML = `
        <div class="error">${escapeHtml(reg.body?.error || "Couldn't reach the substrate.")}</div>
        <p class="dim" style="margin-top:12px;">Your key is still on this device, not lost. Try again in a moment, or ask Ken if it keeps failing.</p>
        <div class="actions"><button class="btn" id="retry">Try again</button></div>
      `;
      document.getElementById("retry").addEventListener("click", renderRegister);
      return;
    }

    // Confirm via /api/me
    const me = await api("/api/me");
    if (!me.body?.registered) {
      out.innerHTML = `<div class="error">Registration didn't take. Refresh and try again, or ask Ken.</div>`;
      return;
    }
    state.me = me.body;

    out.innerHTML = `
      <div class="fingerprint" style="font-size:16px;">${escapeHtml(state.fingerprint)}</div>
      <p class="fingerprint-note">Registered. Your key is now bound to operator-id
        <strong>${escapeHtml(state.operator.id)}</strong>.
        From this moment, the substrate accepts requests signed by your key
        and refuses anything else under your identity.</p>
      <div class="actions" style="margin-top:8px;">
        <button class="btn" id="cont">Continue</button>
      </div>
    `;

    await emit(3, "operator:registered", "completed",
      { fingerprint: state.fingerprint, replacedPlaceholder: true }, "Identity registered");

    document.getElementById("cont").addEventListener("click", renderRecovery);
  });
}

// ══════════════════════════════════════════════════════════════════════
// Phase 4 — Recovery
// ══════════════════════════════════════════════════════════════════════
async function renderRecovery() {
  setIndicator("recovery");

  const wordsHtml = state.mnemonic.map((w, i) => `
    <div class="mnemonic-word">
      <span class="mnemonic-num">${String(i + 1).padStart(2, "0")}</span>
      <span class="mnemonic-text">${w}</span>
    </div>`).join("");

  card.innerHTML = `
    <div class="phase">
      <h2>Recovery phrase</h2>
      <h1>Your twenty-four words</h1>
      ${stewardHtml(
        "Now the recovery phrase. Twenty-four words. If you ever lose this device or its disk fails, those words are how you regain access to your operator identity. No one — not me, not the substrate, not Ken — can recover them for you. They're yours alone.",
        "Write them down. On paper. By hand. Twice. Keep the two copies in physically separate places — one at home, one in a safe deposit box, or similar.",
        "Don't photograph them. Don't email them. Don't store them in a notes app or password manager. Don't read them aloud on a call you don't control.",
        "Take your time. Write carefully. When both copies are done, confirm below."
      )}
      <div class="mnemonic-warning">⚠ These words cannot be recovered from any device or server. Write them now.</div>
      <div class="mnemonic-box"><div class="mnemonic-grid">${wordsHtml}</div></div>
      <label class="confirm" for="cb1">
        <input type="checkbox" id="cb1">
        <label for="cb1">I've written these twenty-four words on paper, in order.</label>
      </label>
      <label class="confirm" for="cb2">
        <input type="checkbox" id="cb2">
        <label for="cb2">I have two copies, stored in two separate places.</label>
      </label>
      <div class="actions"><button class="btn" id="cont" disabled>Continue</button></div>
      <p class="helper">No one — not Ken, not the Foundation — will ever ask you to share or type these words again, except during a recovery you initiate.</p>
    </div>
  `;

  const cb1  = document.getElementById("cb1");
  const cb2  = document.getElementById("cb2");
  const cont = document.getElementById("cont");
  const updateBtn = () => { cont.disabled = !(cb1.checked && cb2.checked); };
  cb1.addEventListener("change", updateBtn);
  cb2.addEventListener("change", updateBtn);

  cont.addEventListener("click", async () => {
    cont.disabled = true;
    cont.textContent = "Logging…";

    // Steward ack
    card.querySelector(".phase").insertAdjacentHTML("beforeend", `
      <div class="steward" style="margin-top:16px;margin-bottom:0;">
        <p>Logged. The substrate has recorded that you confirmed your phrase is written down —
           not the phrase itself, just the acknowledgment. If you ever need recovery, the
           substrate will ask for the words; you'll read them from the paper you just wrote.</p>
      </div>
    `);

    await emit(4, "onboard:recovery:acknowledged", "completed",
      {}, "Recovery phrase acknowledged");

    await sleep(2200);
    await renderPasskey();
  });
}

// ══════════════════════════════════════════════════════════════════════
// Phase 5 — Passkey
// ══════════════════════════════════════════════════════════════════════
async function renderPasskey() {
  setIndicator("passkey");

  // Silent skip if no platform authenticator
  let platformAvailable = false;
  try {
    if (window.PublicKeyCredential?.isUserVerifyingPlatformAuthenticatorAvailable) {
      platformAvailable = await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable();
    }
  } catch { /* ignore */ }

  if (!platformAvailable) {
    await emit(5, "onboard:passkey:skipped", "skipped",
      { reason: "no-platform-authenticator" }, "Passkey skipped (no authenticator)");
    await renderVoice();
    return;
  }

  card.innerHTML = `
    <div class="phase">
      <h2>Passkey</h2>
      <h1>Set up your daily sign-in</h1>
      ${stewardHtml(
        "Optional convenience: register a passkey on this device for faster sign-in. With a passkey, your next visit signs you in with your fingerprint, Face ID, or hardware key — no recovery phrase, no typing. It works only on this device; you can register more later from settings.",
        "Your call: register now, or skip."
      )}
      <div class="actions">
        <button class="btn" id="setup">Register a passkey</button>
        <button class="btn btn-secondary" id="skip">Skip for now</button>
      </div>
      <div id="out"></div>
      <p class="helper">You can always set this up later from settings.</p>
    </div>
  `;

  const out   = document.getElementById("out");
  const setup = document.getElementById("setup");
  const skip  = document.getElementById("skip");

  skip.addEventListener("click", async () => {
    setup.disabled = true; skip.disabled = true;
    out.innerHTML = stewardHtml("Skipped. You'll sign in with your operator-id and signed requests for now. You can register a passkey from settings anytime.");
    await emit(5, "onboard:passkey:skipped", "skipped",
      { reason: "user-skipped" }, "Passkey skipped");
    await sleep(1600);
    await renderVoice();
  });

  setup.addEventListener("click", async () => {
    setup.disabled = true; skip.disabled = true;
    out.innerHTML = `<div class="working" style="padding:20px 0 8px;"><div class="pulse" style="width:32px;height:32px;border-width:1.5px;"></div><div class="working-label">Waiting for your device…</div></div>`;
    try {
      await registerPasskey();
      out.innerHTML = stewardHtml("Registered. You'll see a passkey option next time you visit on this device.");
      await emit(5, "onboard:passkey:registered", "completed",
        { device: inferDeviceName() }, "Passkey registered");
      await sleep(1600);
      await renderVoice();
    } catch (err) {
      if (err?.name === "NotAllowedError") {
        // User cancelled — allow retry or skip
        out.innerHTML = `<div class="error">Setup cancelled. You can try again or skip.</div>`;
      } else {
        await emit(5, "onboard:passkey:failed", "failed",
          { reason: err?.message || "unknown" }, "Passkey failed");
        out.innerHTML = `<div class="error">${escapeHtml(err?.message || "Setup didn't complete")}</div>
          <p class="dim" style="margin-top:10px;">No problem — you can try again from settings later.</p>`;
        await sleep(1200);
        await emit(5, "onboard:passkey:skipped", "skipped",
          { reason: "error-fallback" }, "Passkey skipped (error)");
        await renderVoice();
      }
      setup.disabled = false; skip.disabled = false;
    }
  });
}

// ══════════════════════════════════════════════════════════════════════
// Phase 5.5 — Voice
// ══════════════════════════════════════════════════════════════════════
async function renderVoice() {
  setIndicator("voice");

  const voiceCards = VOICES.map(v => `
    <div class="voice-card${v.default ? " selected" : ""}" data-id="${v.id}" role="radio" tabindex="0">
      <div class="voice-info">
        <div class="voice-name">${escapeHtml(v.name)}${v.default ? " <span style='color:var(--text-faint);font-size:12px;font-weight:400;'>(suggested)</span>" : ""}</div>
        <div class="voice-desc">${escapeHtml(v.desc)}</div>
      </div>
      <button class="voice-play" data-id="${v.id}" type="button">▶ Sample</button>
    </div>
  `).join("");

  card.innerHTML = `
    <div class="phase">
      <h2>Voice</h2>
      <h1>How I'll sound</h1>
      ${stewardHtml(
        "One last small choice. I can speak in a few different voices — pick the one you'd like me to use in our daily work. Each option has a short sample. All voices run locally on the Foundation's substrate; nothing leaves.",
        "You can change this later from settings."
      )}
      <div class="voice-grid" id="voice-grid">${voiceCards}</div>
      <div class="actions"><button class="btn" id="cont">Continue with selected</button></div>
    </div>
  `;

  let currentAudio = null;
  const grid = document.getElementById("voice-grid");

  // Selection
  grid.querySelectorAll(".voice-card").forEach(card => {
    const select = () => {
      grid.querySelectorAll(".voice-card").forEach(c => c.classList.remove("selected"));
      card.classList.add("selected");
      state.voiceId = card.dataset.id;
    };
    card.addEventListener("click", e => {
      if (e.target.closest(".voice-play")) return; // handled separately
      select();
    });
    card.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); select(); }
    });
  });

  // Sample playback
  grid.querySelectorAll(".voice-play").forEach(btn => {
    btn.addEventListener("click", async () => {
      const voiceId = btn.dataset.id;
      // Stop current if playing
      if (currentAudio) { currentAudio.pause(); currentAudio = null; }
      grid.querySelectorAll(".voice-play").forEach(b => b.classList.remove("playing"));

      const audio = new Audio(`/onboard/voices/${voiceId}-sample.mp3`);
      currentAudio = audio;
      btn.classList.add("playing");
      btn.textContent = "▶ Playing…";

      audio.addEventListener("ended", () => {
        btn.classList.remove("playing");
        btn.textContent = "▶ Sample";
        if (currentAudio === audio) currentAudio = null;
      });
      audio.addEventListener("error", () => {
        btn.classList.remove("playing");
        btn.textContent = "▶ Sample";
        // Graceful fallback — sample not available yet
        btn.title = "Sample not yet available";
        if (currentAudio === audio) currentAudio = null;
      });
      try { await audio.play(); } catch { /* autoplay blocked */ }
    });
  });

  document.getElementById("cont").addEventListener("click", async () => {
    if (currentAudio) { currentAudio.pause(); currentAudio = null; }

    // If nothing explicitly selected, default to bm_george
    const selectedCard = grid.querySelector(".voice-card.selected");
    if (selectedCard) state.voiceId = selectedCard.dataset.id;

    // Steward confirmation in the chosen "voice" (text only at v1)
    const voice = VOICES.find(v => v.id === state.voiceId) || VOICES[0];
    card.querySelector(".phase").insertAdjacentHTML("beforeend", `
      <div class="steward" style="margin-top:16px;margin-bottom:0;">
        <p>Selected. From now on, this is the voice you'll hear when I speak.</p>
      </div>
    `);
    document.getElementById("cont").disabled = true;

    await emit(6, "onboard:voice:selected", "completed",
      { voiceId: state.voiceId, engine: "kokoro" }, `Voice selected: ${voice.name}`);

    await sleep(1800);
    await renderBound();
  });
}

// ══════════════════════════════════════════════════════════════════════
// Phase 6 — Bound
// ══════════════════════════════════════════════════════════════════════
async function renderBound() {
  setIndicator("bound");

  const role = state.me?.role || "director";
  const copy = ROLE_COPY[role] || ROLE_COPY.director;

  // For plain directors, denied = read another director's private mail
  let denied = copy.demoDenied;
  if (!denied) {
    const { body } = await api("/api/operators/active");
    const others = (body?.operators ?? []).filter(o =>
      o.id !== state.operator.id && !["info", "board"].includes(o.id));
    if (others.length) {
      const t = others[0];
      denied = { path: `/api/mail/${t.id}`, cap: `mail:read:${t.id}`,
        label: `Read ${escapeHtml(t.name)}'s private mail` };
    } else {
      denied = { path: "/api/operators", cap: "workspace:admin", label: "List all operators (admin only)" };
    }
  }

  card.innerHTML = `
    <div class="phase">
      <h2>Boundaries</h2>
      <h1>How your authority works</h1>
      ${stewardHtml(
        "Last technical step before we hand you off to your daily surface: a demonstration of how your authority works. I'll attempt two actions on your behalf. The first should succeed because your role permits it. The second should fail because it doesn't. Both produce receipts — the failure as visibly as the success."
      )}
      <div class="demo-panels">
        <div class="demo-panel">
          <div class="demo-panel-label">Allowed action</div>
          <div class="demo-panel-action">${escapeHtml(copy.demoAllowed.label)}</div>
          <button class="btn btn-secondary" id="run-allow" style="width:100%;">Run</button>
          <div id="allow-result"></div>
        </div>
        <div class="demo-panel">
          <div class="demo-panel-label">Denied action</div>
          <div class="demo-panel-action">${escapeHtml(denied.label)}</div>
          <button class="btn btn-secondary" id="run-deny" style="width:100%;">Run</button>
          <div id="deny-result"></div>
        </div>
      </div>
      <div class="actions"><button class="btn" id="finish" disabled>Finish</button></div>
    </div>
  `;

  let allowDone = false;
  let denyDone  = false;
  const finish = document.getElementById("finish");
  const maybeEnableFinish = () => { if (allowDone && denyDone) finish.disabled = false; };

  document.getElementById("run-allow").addEventListener("click", async () => {
    const btn = document.getElementById("run-allow");
    btn.disabled = true;
    const { res } = await api(copy.demoAllowed.path);
    const ok = res.ok;
    const ar = document.getElementById("allow-result");
    if (ok) {
      ar.innerHTML = `<div class="demo-result"><span class="mark allow">✓</span>${escapeHtml(copy.demoAllowed.label)}<div class="outcome-note">Allowed and recorded.</div></div>`;
      await emit(7, "onboard:capability:demonstrated:allow", "completed",
        { capability: copy.demoAllowed.cap, outcome: "allowed" }, "Allow demo");
    } else {
      ar.innerHTML = `<div class="demo-result"><span class="mark deny">✗</span>Unexpected — please tell Ken.<div class="outcome-note">(expected allow, got ${res.status})</div></div>`;
      await emit(7, "onboard:capability:incident", "completed",
        { unexpectedDeny: copy.demoAllowed.cap, status: res.status }, "Allow demo — unexpected deny");
    }
    allowDone = true; maybeEnableFinish();
  });

  document.getElementById("run-deny").addEventListener("click", async () => {
    const btn = document.getElementById("run-deny");
    btn.disabled = true;
    const { res } = await api(denied.path);
    const wasRefused = !res.ok && (res.status === 403 || res.status === 401);
    const dr = document.getElementById("deny-result");
    if (wasRefused) {
      dr.innerHTML = `<div class="demo-result"><span class="mark deny">×</span>${escapeHtml(denied.label)}<div class="outcome-note">Denied — and the refusal is now in the Foundation's permanent record.</div></div>`;
      await emit(7, "onboard:capability:demonstrated:deny", "completed",
        { capability: denied.cap, outcome: "denied", reason: "role-boundary" }, "Deny demo");
    } else {
      // Unexpected allow — real incident
      dr.innerHTML = `<div class="demo-result"><span class="mark allow" style="color:var(--red);">⚠</span>That shouldn't have worked. Stop here and tell Ken now. The receipt is in the chain.<div class="outcome-note">Incident recorded.</div></div>`;
      await emit(7, "onboard:capability:incident", "completed",
        { unexpectedAllow: denied.cap, status: res.status }, "Deny demo — unexpected allow (INCIDENT)");
    }
    denyDone = true; maybeEnableFinish();
  });

  finish.addEventListener("click", async () => {
    finish.disabled = true;
    await renderHandoff();
  });
}

// ══════════════════════════════════════════════════════════════════════
// Phase 7 — Handoff

  const voice = VOICES.find(v => v.id === state.voiceId) || VOICES[0];

  await emit(8, "onboard:complete", "completed", {
    fingerprint: state.fingerprint,
    voiceId: state.voiceId,
    receiptsEmitted: state.receiptIds,
  }, "Onboarding complete");

  const receiptRows = state.receiptLabels.map((lbl, i) =>
    `<li><span class="summary-key">${escapeHtml(lbl)}</span><span class="summary-val">${escapeHtml(state.receiptIds[i]?.slice(0,12) || "—")}…</span></li>`
  ).join("");

  const capsHtml = (copy.abilities || []).map(a => `<li>${escapeHtml(a)}</li>`).join("");

  card.innerHTML = `
    <div class="phase">
      <h2>Welcome aboard</h2>
      <h1>${escapeHtml(name)}.</h1>
      ${stewardHtml(
        "You're commissioned. Your operator identity is bound, your recovery is recorded, your boundaries are demonstrated. Six receipts in the chain mark each step; that's your record of joining.",
        `From here on, your daily surface is at <strong>app.zeropointfoundation.org</strong>. I'll be there — same voice, same patterns, with the context of your role and whatever work you take on.`,
        `Welcome aboard, ${escapeHtml(name)}.`
      )}

      <div class="summary">
        <div class="summary-row">
          <span class="summary-key">Key fingerprint</span>
          <span class="summary-val">${escapeHtml(state.fingerprint)}</span>
        </div>
        <div class="summary-row">
          <span class="summary-key">Role</span>
          <span class="summary-val plain">${escapeHtml(copy.title)}</span>
        </div>
        <div class="summary-row">
          <span class="summary-key">Voice</span>
          <span class="summary-val plain">${escapeHtml(voice.name)}</span>
        </div>
        <div class="summary-row">
          <span class="summary-key">Receipts</span>
          <span class="summary-val plain">${state.receiptIds.length} in chain</span>
        </div>
      </div>

      <p class="dim" style="margin-bottom:8px;">Capabilities:</p>
      <ul class="caps">${capsHtml}</ul>

      <p class="receipt-count">${state.receiptIds.length} receipts recorded during this ceremony.</p>

      <div class="actions">
        <a href="https://app.zeropointfoundation.org" class="btn" style="text-decoration:none;display:inline-flex;align-items:center;gap:8px;">
          Go to my workspace →
        </a>
      </div>
    </div>
  `;

  // All dots complete
  for (const dot of indicator.querySelectorAll(".dot")) {
    dot.classList.remove("active");
    dot.classList.add("complete");
  }
}

// ─── Boot ────────────────────────────────────────────────────────────
renderWelcome();
</script>
</body>
</html>
