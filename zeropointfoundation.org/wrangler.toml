name = "zeropoint-foundation"
main = "src/worker.js"
compatibility_date = "2025-04-01"

# Foundation workspace — separate Cloudflare Worker from the public
# zeropoint.global site. Routes ONLY zeropointfoundation.org and its
# variants; access is gated by Cloudflare Access policy on those zones
# (configure in Cloudflare Dashboard → Access → Applications).
routes = [
  { pattern = "zeropointfoundation.org/*", zone_name = "zeropointfoundation.org" },
  { pattern = "www.zeropointfoundation.org/*", zone_name = "zeropointfoundation.org" },
]
# Additional foundation-domain variants — uncomment once each zone is
# added to Cloudflare and Access policy is configured for it:
#   { pattern = "zeropointfoundation.com/*", zone_name = "zeropointfoundation.com" },
#   { pattern = "www.zeropointfoundation.com/*", zone_name = "zeropointfoundation.com" },
#   { pattern = "zeropointfoundation.net/*", zone_name = "zeropointfoundation.net" },
#   { pattern = "www.zeropointfoundation.net/*", zone_name = "zeropointfoundation.net" },
#   { pattern = "zeropoint.foundation/*", zone_name = "zeropoint.foundation" },
#   { pattern = "www.zeropoint.foundation/*", zone_name = "zeropoint.foundation" },
#
# NOTE: zeropoint.global is INTENTIONALLY ABSENT — that's the public
# site, served by the `zeropoint-global` worker out of ../zeropoint.global/.

# Static assets served from the project root
# See .assetsignore for excluded paths (.wrangler, src, node_modules, etc.)
[assets]
directory = "."
binding = "ASSETS"

# ── Sovereign Workspace Bindings ──────────────────────────────────
# To create these resources for the first time, run:
#   npx wrangler d1 create zpmail
#   npx wrangler r2 bucket create zp-storage
# Then paste the returned database_id below.

[[d1_databases]]
binding = "DB"
database_name = "zpmail"
database_id = "feae4a47-4a7a-4eef-915e-afbabdf95380"

[[r2_buckets]]
binding = "STORAGE"
bucket_name = "zp-storage"

[vars]
EMAIL_PROVIDER = "resend"
FOUNDATION_DOMAIN = "zeropointfoundation.org"
# Ed25519 public key for the foundation signing keypair (not secret — it's the
# verification key). Set FOUNDATION_SIGNING_KEY_PKCS8_B64 as a wrangler secret.
# Generate both with: node scripts/gen-foundation-keypair.js
FOUNDATION_SIGNING_KEY_PUB_HEX = "5579573d1684ea7ae8e626f4f5d125ae8cc915203624fcd6d4380be6200f5e10"

# ── Email Worker ──────────────────────────────────────────────────
# Cloudflare Email Routing sends inbound mail to the email() handler.
# Configure in Cloudflare Dashboard → Email → Routing → Catch-all → Worker.

# ── Secrets (set via `wrangler secret put`) ───────────────────────
# RESEND_API_KEY       — Outbound email relay via Resend
# DKIM_PRIVATE_KEY     — Domain signing for deliverability
# GOVERNANCE_PUBLIC_KEY — Ed25519 public key for request verification
# SESSION_SIGNING_KEY  — HMAC key for session tokens

# ── Environments ──────────────────────────────────────────────────

[env.staging]
name = "zeropoint-foundation-staging"

[[env.staging.d1_databases]]
binding = "DB"
database_name = "zpmail-staging"
database_id = "TO_BE_CREATED"

[[env.staging.r2_buckets]]
binding = "STORAGE"
bucket_name = "zp-storage-staging"

[env.staging.vars]
EMAIL_PROVIDER = "resend"
FOUNDATION_DOMAIN = "staging.zeropointfoundation.org"
